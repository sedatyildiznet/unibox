name: Apply Native Runtime Fixes

on:
  push:
    branches: [release/native-hotfix]
    paths: ['.github/workflows/apply-native-runtime-fixes.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-runtime
          fetch-depth: 0

      - name: Patch Telegram config placement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/desktop/src-tauri/src/native_runtime.rs')
          s = p.read_text(encoding='utf-8')
          old = '''            let network = mapping_child(root, "network");
            set_yaml(network, "api_id", YamlValue::Number(api_id.into()));
            set_yaml(network, "api_hash", YamlValue::String(api_hash));
'''
          new = '''            set_yaml(root, "api_id", YamlValue::Number(api_id.into()));
            set_yaml(root, "api_hash", YamlValue::String(api_hash));
'''
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          elif 'set_yaml(root, "api_id"' not in s or 'set_yaml(root, "api_hash"' not in s:
              raise SystemExit('Expected Telegram config block not found')
          if 'append_pair("user_id", &session.user_id)' not in s:
              raise SystemExit('BridgeV2 provisioning user_id auth fix is missing')
          PY

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src/native_runtime.rs
          git commit -m 'fix(telegram): write API credentials to bridge config root'
          git push origin HEAD:native-runtime
