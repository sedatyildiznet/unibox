name: Bootstrap lockfiles

on:
  push:
    branches: [stability-hardening]
    paths:
      - '.github/workflows/bootstrap-lockfiles.yml'

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-hardening
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only
      - name: Generate Cargo lockfile
        run: cargo generate-lockfile
      - name: Commit lockfiles
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Lockfiles are already committed.'
            exit 0
          }
          git commit -m "chore: commit dependency lockfiles"
          git push origin HEAD:stability-hardening
