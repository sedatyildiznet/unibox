name: Bootstrap rustfmt

on:
  push:
    branches: [stability-hardening]
    paths:
      - '.github/workflows/bootstrap-rustfmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-hardening
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Rust sources are already formatted.'
            exit 0
          }
          git commit -m "style: format Rust workspace"
          git push origin HEAD:stability-hardening
