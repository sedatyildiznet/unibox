name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile=false
      - name: Verify connector registry
        run: python scripts/verify-registry.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify managed runtime contract
        run: python scripts/verify-runtime-contract.py
      - name: Validate runtime shell scripts
        shell: bash
        run: |
          bash -n apps/desktop/src-tauri/resources/runtime/provision-runtime.sh
          bash -n apps/desktop/src-tauri/resources/runtime/unibox-connector.sh
      - name: Validate PowerShell bootstrap syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'apps/desktop/src-tauri/resources/runtime/bootstrap.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - run: pnpm check
      - run: pnpm build
      - run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: unibox-windows-smoke
          path: target/release/unibox-desktop.exe
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lockfiles
          path: |
            pnpm-lock.yaml
            Cargo.lock
          if-no-files-found: ignore
          retention-days: 3
