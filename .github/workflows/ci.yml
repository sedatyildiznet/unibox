name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - name: Verify connector registry
        run: python scripts/verify-registry.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify managed runtime contract
        run: python scripts/verify-runtime-contract.py
      - name: Validate runtime shell scripts
        shell: bash
        run: |
          bash -n apps/desktop/src-tauri/resources/runtime/provision-runtime.sh
          bash -n apps/desktop/src-tauri/resources/runtime/unibox-connector.sh
      - name: Validate PowerShell bootstrap syntax
        shell: pwsh
        run: |
          foreach ($file in @('apps/desktop/src-tauri/resources/runtime/bootstrap.ps1', 'scripts/test-bootstrap.ps1', 'scripts/test-windows-runtime.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          }
      - name: Test Windows PowerShell 5.1 bootstrap lifecycle
        shell: powershell
        run: ./scripts/test-bootstrap.ps1
      - name: Test modern PowerShell bootstrap lifecycle
        shell: pwsh
        run: ./scripts/test-bootstrap.ps1
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: cargo check --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build release executable
        run: pnpm tauri build --no-bundle
      - name: Build unsigned NSIS installer smoke package
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: unibox-windows-smoke
          path: target/release/unibox-desktop.exe
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: unibox-windows-installer-smoke
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
