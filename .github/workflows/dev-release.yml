name: Legacy Development Windows Release (manual only)

# Retained only for historical/manual debugging. The current Windows release
# pipeline is the WSL-free native runtime workflow on native-runtime.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  legacy-build:
    runs-on: windows-latest
    steps:
      - name: Legacy pipeline retired
        shell: pwsh
        run: |
          Write-Host 'The v0.2.0 WSL development release pipeline is retired.'
          Write-Host 'Use the native Windows release workflow instead.'
