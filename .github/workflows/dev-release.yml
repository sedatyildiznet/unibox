name: Development Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unibox-dev-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null

          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) {
            Write-Error 'NSIS installer was not generated.'
            exit 1
          }

          if (-not (Test-Path 'target/release/unibox-desktop.exe')) {
            Write-Error 'Portable executable was not generated.'
            exit 1
          }

          Copy-Item $installer.FullName 'dist-release/Unibox-Setup.exe' -Force
          Copy-Item 'target/release/unibox-desktop.exe' 'dist-release/Unibox-Portable.exe' -Force

      - name: Publish development release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.2.0-dev'
          $title = 'Unibox v0.2.0 Development Build'
          $notes = @"
          Development build generated automatically from the latest main branch.

          Files:
          - Unibox-Setup.exe — Windows NSIS installer
          - Unibox-Portable.exe — raw desktop executable

          This build is currently unsigned and intended for testing while production signing is being finalized.
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag 'dist-release/Unibox-Setup.exe' 'dist-release/Unibox-Portable.exe' --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --title $title --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag 'dist-release/Unibox-Setup.exe' 'dist-release/Unibox-Portable.exe' --target $env:GITHUB_SHA --title $title --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
          }
