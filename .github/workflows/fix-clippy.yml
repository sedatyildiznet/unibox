name: Apply Clippy cleanup

on:
  push:
    branches:
      - stability-hardening

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-hardening
      - name: Apply Clippy fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/unibox-core/src/lib.rs')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '            return output_text(output, "runtime bootstrap failed");': '            output_text(output, "runtime bootstrap failed")',
              '            return output_text(output, "failed to start local services");': '            output_text(output, "failed to start local services")',
              '            return output_text(output, "failed to stop local runtime");': '            output_text(output, "failed to stop local runtime")',
              'matches!(status.as_u16(), 301 | 302 | 303)': 'matches!(status.as_u16(), 301..=303)',
              '            return output_text(output, "connector operation failed");': '            output_text(output, "connector operation failed")',
              '            return output_text(output, "UniboxRuntime command failed");': '            output_text(output, "UniboxRuntime command failed")',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          text = text.replace('            return out\n                .ok()', '            out\n                .ok()')
          text = text.replace('                .unwrap_or(false);\n        }\n        #[cfg(not(target_os = "windows"))]\n        false', '                .unwrap_or(false)\n        }\n        #[cfg(not(target_os = "windows"))]\n        false')

          old_decode = '''fn decode_output(bytes: &[u8]) -> String {
              if bytes.len() >= 2 && bytes[1] == 0 {
                  let words: Vec<u16> = bytes
                      .chunks_exact(2)
                      .map(|chunk| u16::from_le_bytes([chunk[0], chunk[1]]))
                      .collect();
                  String::from_utf16_lossy(&words)
              } else {
                  String::from_utf8_lossy(bytes).to_string()
              }
          }'''.replace('          ', '')
          new_decode = '''fn decode_output(bytes: &[u8]) -> String {
              if bytes.len() >= 2 && bytes[1] == 0 {
                  let mut words = Vec::with_capacity(bytes.len() / 2);
                  let mut index = 0;
                  while index + 1 < bytes.len() {
                      words.push(u16::from_le_bytes([bytes[index], bytes[index + 1]]));
                      index += 2;
                  }
                  String::from_utf16_lossy(&words)
              } else {
                  String::from_utf8_lossy(bytes).to_string()
              }
          }'''.replace('          ', '')
          text = text.replace(old_decode, new_decode)
          path.write_text(text, encoding='utf-8')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo clippy -p unibox-core --all-targets --locked -- -D warnings
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/unibox-core/src/lib.rs
          if git diff --cached --quiet; then
            echo 'No Clippy cleanup changes required.'
            exit 0
          fi
          git commit -m 'fix: satisfy Rust 1.98 clippy'
          git push origin HEAD:stability-hardening
