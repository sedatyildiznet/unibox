name: Apply IPv6 URL policy fix

on:
  push:
    branches:
      - stability-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-hardening
      - name: Patch bracketed IPv6 host handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/unibox-core/src/lib.rs')
          text = path.read_text(encoding='utf-8')

          old1 = '    if host.parse::<IpAddr>().is_ok() {\n        return Ok(());\n    }'
          new1 = '    if parse_host_ip(host).is_some() {\n        return Ok(());\n    }'
          if old1 not in text:
              raise SystemExit('missing direct-IP parse block')
          text = text.replace(old1, new1, 1)

          old2 = '''    host.parse::<IpAddr>()
              .map(|ip| !is_private_ip(ip))
              .unwrap_or(true)
          }

          fn is_private_ip(ip: IpAddr) -> bool {'''.replace('          ', '')
          new2 = '''    parse_host_ip(host)
              .map(|ip| !is_private_ip(ip))
              .unwrap_or(true)
          }

          fn parse_host_ip(host: &str) -> Option<IpAddr> {
              let normalized = host
                  .strip_prefix('[')
                  .and_then(|value| value.strip_suffix(']'))
                  .unwrap_or(host);
              normalized.parse::<IpAddr>().ok()
          }

          fn is_private_ip(ip: IpAddr) -> bool {'''.replace('          ', '')
          if old2 not in text:
              raise SystemExit('missing URL allow-policy parse block')
          text = text.replace(old2, new2, 1)

          old3 = '            "https://[::1]/test",\n            "https://[fc00::1]/test",'
          new3 = '            "https://[::1]/test",\n            "https://[::]/test",\n            "https://[fc00::1]/test",\n            "https://[fe80::1]/test",'
          if old3 not in text:
              raise SystemExit('missing IPv6 test cases block')
          text = text.replace(old3, new3, 1)

          if 'fn parse_host_ip(host: &str) -> Option<IpAddr>' not in text:
              raise SystemExit('IPv6 helper was not inserted')
          if 'if parse_host_ip(host).is_some()' not in text:
              raise SystemExit('direct IP path was not updated')

          path.write_text(text, encoding='utf-8')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo test -p unibox-core --locked
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/unibox-core/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: normalize bracketed IPv6 connector hosts'
          git push origin HEAD:stability-hardening
