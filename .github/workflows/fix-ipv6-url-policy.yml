name: Apply IPv6 URL policy fix

on:
  push:
    branches:
      - stability-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability-hardening
      - name: Patch bracketed IPv6 host handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/unibox-core/src/lib.rs')
          text = path.read_text(encoding='utf-8')

          needle = 'host.parse::<IpAddr>()'
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f'expected 2 host IP parse sites, found {count}')
          text = text.replace(needle, 'parse_host_ip(host)')

          marker = 'fn is_private_ip(ip: IpAddr) -> bool {'
          if marker not in text:
              raise SystemExit('missing is_private_ip marker')
          helper = '''fn parse_host_ip(host: &str) -> Option<IpAddr> {
              let normalized = host
                  .strip_prefix('[')
                  .and_then(|value| value.strip_suffix(']'))
                  .unwrap_or(host);
              normalized.parse::<IpAddr>().ok()
          }

          '''.replace('          ', '')
          text = text.replace(marker, helper + marker, 1)

          old_tests = '            "https://[::1]/test",\n            "https://[fc00::1]/test",'
          new_tests = '            "https://[::1]/test",\n            "https://[::]/test",\n            "https://[fc00::1]/test",\n            "https://[fe80::1]/test",'
          if old_tests not in text:
              raise SystemExit('missing IPv6 test list marker')
          text = text.replace(old_tests, new_tests, 1)

          if text.count('parse_host_ip(host)') != 2:
              raise SystemExit('unexpected normalized host parse count')
          if 'fn parse_host_ip(host: &str) -> Option<IpAddr>' not in text:
              raise SystemExit('helper insertion failed')

          path.write_text(text, encoding='utf-8')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo test -p unibox-core --locked
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/unibox-core/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: normalize bracketed IPv6 connector hosts'
          git push origin HEAD:stability-hardening
