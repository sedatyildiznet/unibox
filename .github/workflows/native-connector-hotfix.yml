name: Native Connector Hotfix

on:
  push:
    branches: [native-runtime]
    paths:
      - '.github/workflows/native-connector-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-runtime
          fetch-depth: 0

      - name: Patch Windows connector registration flow
        shell: python
        run: |
          from pathlib import Path

          p = Path('apps/desktop/src-tauri/src/native_runtime.rs')
          s = p.read_text(encoding='utf-8')

          old = '''        let state = self.connector_state(connector);
          fs::create_dir_all(&state)?;
          let config = self.connector_config(connector);
          let registration = state.join("registration.yaml");

          if !config.is_file() {
              self.run_connector_command(
                  connector,
                  &["-e", "-c"],
                  Some(&config),
                  "example config generation",
              )?;
          }
          self.patch_connector_config(connector, &config)?;
          if registration.exists() {
              let _ = fs::remove_file(&registration);
          }
          self.run_connector_command_with_registration(
              connector,
              &config,
              &registration,
              "appservice registration generation",
          )?;
  '''

          new = '''        let state = self.connector_state(connector);
          fs::create_dir_all(&state)?;
          let config = self.connector_config(connector);
          let registration = state.join("registration.yaml");
          let registration_config = state.join("registration-config.yaml");

          // A previous connector process from the same Unibox session must never keep
          // config.yaml open while the bridge performs its Windows config migration.
          self.kill_connector(&connector.id);

          if !config.is_file() {
              self.run_connector_command(
                  connector,
                  &["-e", "-c"],
                  Some(&config),
                  "example config generation",
              )?;
          }
          self.patch_connector_config(connector, &config)?;

          // mautrix -g may atomically rewrite the config it receives. On Windows that
          // rename fails if another process/AV scanner briefly has config.yaml open.
          // Generate the registration against an isolated disposable copy instead of
          // the live runtime config, then discard it. The running bridge only ever
          // consumes config.yaml.
          if registration_config.exists() {
              let _ = fs::remove_file(&registration_config);
          }
          fs::copy(&config, &registration_config).with_context(|| {
              format!("failed to stage {} registration config", connector.name)
          })?;
          if registration.exists() {
              let _ = fs::remove_file(&registration);
          }

          let mut last_error = None;
          for attempt in 0..5u64 {
              if registration.exists() {
                  let _ = fs::remove_file(&registration);
              }
              match self.run_connector_command_with_registration(
                  connector,
                  &registration_config,
                  &registration,
                  "appservice registration generation",
              ) {
                  Ok(()) => {
                      last_error = None;
                      break;
                  }
                  Err(error) => {
                      last_error = Some(error);
                      std::thread::sleep(Duration::from_millis(200 * (attempt + 1)));
                  }
              }
          }
          let _ = fs::remove_file(&registration_config);
          if let Some(error) = last_error {
              return Err(error.context(format!(
                  "{} registration remained locked after retries",
                  connector.name
              )));
          }
  '''

          if new in s:
              print('hotfix already present')
          elif old not in s:
              raise SystemExit('expected install_connector block not found; refusing unsafe patch')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('patched native_runtime.rs')

      - name: Format and verify Rust
        run: |
          cargo fmt --all -- --check || cargo fmt --all
          cargo check --workspace --locked

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "Sedat Yıldız"
          git config user.email "info@sedatyildiz.net"
          git add apps/desktop/src-tauri/src/native_runtime.rs
          git commit -m "fix(native): avoid Windows connector config lock during registration"
          git push origin native-runtime
