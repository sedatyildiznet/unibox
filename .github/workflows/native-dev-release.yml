name: Native Windows Development Release

on:
  push:
    branches:
      - native-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unibox-native-dev-release
  cancel-in-progress: true

env:
  TUWUNEL_REF: v1.9.0
  MAUTRIX_REF: v0.2608.0

jobs:
  build-tuwunel:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Checkout Tuwunel
        shell: pwsh
        run: git clone --depth 1 --branch $env:TUWUNEL_REF https://github.com/matrix-construct/tuwunel.git vendor/tuwunel

      - name: Configure build environment
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build native Tuwunel
        working-directory: vendor/tuwunel
        shell: pwsh
        run: cargo build --release --no-default-features

      - name: Stage Tuwunel
        shell: pwsh
        run: |
          $bin = Get-ChildItem vendor/tuwunel/target/release -Filter 'tuwunel.exe' -Recurse | Select-Object -First 1
          if (-not $bin) { throw 'tuwunel.exe was not produced' }
          New-Item -ItemType Directory -Force -Path native-tuwunel | Out-Null
          Copy-Item $bin.FullName native-tuwunel/tuwunel.exe -Force

      - name: Smoke test native Matrix engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'unibox-tuwunel-smoke'
          $db = Join-Path $root 'matrix'
          $apps = Join-Path $root 'appservices'
          New-Item -ItemType Directory -Force -Path $db, $apps | Out-Null
          $dbPosix = $db.Replace('\','/')
          $appsPosix = $apps.Replace('\','/')
          $config = Join-Path $root 'tuwunel.toml'
          @"
          [global]
          server_name = "unibox.local"
          database_path = "$dbPosix"
          address = ["127.0.0.1"]
          port = 18008
          allow_federation = false
          allow_registration = false
          create_admin_room = false
          new_user_displayname_suffix = ""
          appservice_dir = "$appsPosix"
          registration_shared_secret = "unibox-ci-native-smoke-secret"
          log = "warn,tuwunel=info"
          "@ | Set-Content -Path $config -Encoding utf8

          $stdout = Join-Path $root 'stdout.log'
          $stderr = Join-Path $root 'stderr.log'
          $proc = Start-Process -FilePath (Resolve-Path 'native-tuwunel/tuwunel.exe') -ArgumentList @('-c', $config) -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { break }
              try {
                $versions = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18008/_matrix/client/versions' -TimeoutSec 2
                if ($versions.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) {
              if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
              if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }
              throw 'Tuwunel did not become ready on Windows.'
            }
            $nonce = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18008/_synapse/admin/v1/register' -TimeoutSec 5
            if ($nonce.StatusCode -ne 200 -or $nonce.Content -notmatch 'nonce') {
              throw 'Synapse-compatible shared-secret registration endpoint is unavailable.'
            }
          }
          finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: native-tuwunel
          path: native-tuwunel/tuwunel.exe
          if-no-files-found: error
          retention-days: 3

  build-bridge:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: whatsapp
            repo: mautrix/whatsapp
            package: ./cmd/mautrix-whatsapp
            output: mautrix-whatsapp.exe
          - id: telegram
            repo: mautrix/telegram
            package: ./cmd/mautrix-telegram
            output: mautrix-telegram.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Checkout bridge
        shell: pwsh
        run: git clone --depth 1 --branch $env:MAUTRIX_REF https://github.com/${{ matrix.repo }}.git vendor/bridge

      - name: Patch mautrix config writer for Windows
        working-directory: vendor/bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $utilDir = (go list -m -f '{{.Dir}}' go.mau.fi/util).Trim()
          if (-not $utilDir -or -not (Test-Path $utilDir)) {
            throw 'Unable to locate go.mau.fi/util in the module cache.'
          }
          $upgrade = Join-Path $utilDir 'configupgrade\upgrade.go'
          if (-not (Test-Path $upgrade)) {
            throw "Unable to locate configupgrade/upgrade.go at $upgrade"
          }

          attrib -R $upgrade 2>$null
          $raw = Get-Content $upgrade -Raw
          if ($raw -notmatch 'tempFile\.Close\(\)') {
            $needle = "`terr = os.Rename(tempFile.Name(), configPath)"
            if (-not $raw.Contains($needle)) {
              throw 'Expected mautrix config replacement code was not found. Refusing to build an unverified Windows connector.'
            }
            $replacement = @"
          `terr = tempFile.Close()
          `tif err != nil {
          `t`t_ = os.Remove(tempFile.Name())
          `t`treturn output, true, fmt.Errorf("failed to close temp file before replacing config: %w", err)
          `t}
          `terr = os.Rename(tempFile.Name(), configPath)
          "@.Trim()
            $raw = $raw.Replace($needle, $replacement)
            Set-Content -Path $upgrade -Value $raw -NoNewline -Encoding utf8
          }
          gofmt -w $upgrade
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content $upgrade -Raw) -notmatch 'tempFile\.Close\(\)') {
            throw 'Windows config writer patch was not applied.'
          }

      - name: Build native bridge
        working-directory: vendor/bridge
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          New-Item -ItemType Directory -Force -Path ../../native-bridge | Out-Null
          go build -tags goolm -trimpath -ldflags="-s -w" -o ../../native-bridge/${{ matrix.output }} ${{ matrix.package }}

      - name: Verify bridge binary
        shell: pwsh
        run: |
          $path = 'native-bridge/${{ matrix.output }}'
          if (-not (Test-Path $path)) { throw '${{ matrix.output }} was not produced' }
          if ((Get-Item $path).Length -lt 1MB) { throw '${{ matrix.output }} is unexpectedly small' }

      - name: Regression test Windows config replacement and registration generation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'unibox-${{ matrix.id }}-config-smoke'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $config = Join-Path $root 'config.yaml'
          $registration = Join-Path $root 'registration.yaml'
          $exe = (Resolve-Path 'native-bridge/${{ matrix.output }}').Path

          & $exe -e -c $config
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $config)) {
            throw 'Bridge example config generation failed.'
          }

          $cfg = Get-Content $config -Raw
          $cfg = $cfg.Replace('domain: example.com', 'domain: unibox.local')
          $cfg = $cfg.Replace('http://example.localhost:8008', 'http://127.0.0.1:18008')
          Set-Content -Path $config -Value $cfg -NoNewline -Encoding utf8

          & $exe -g -c $config -r $registration
          if ($LASTEXITCODE -ne 0) {
            throw 'Bridge appservice registration generation failed on Windows.'
          }
          if (-not (Test-Path $registration)) {
            throw 'Bridge did not produce registration.yaml.'
          }
          $after = Get-Content $config -Raw
          if ($after -notmatch 'as_token:' -or $after -notmatch 'hs_token:') {
            throw 'Generated appservice tokens were not persisted to config.yaml.'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: native-bridge-${{ matrix.id }}
          path: native-bridge/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 3

  package:
    needs: [build-tuwunel, build-bridge]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: native-tuwunel
          path: apps/desktop/src-tauri/resources/native-v034

      - uses: actions/download-artifact@v4
        with:
          name: native-bridge-whatsapp
          path: apps/desktop/src-tauri/resources/native-v034/connectors

      - uses: actions/download-artifact@v4
        with:
          name: native-bridge-telegram
          path: apps/desktop/src-tauri/resources/native-v034/connectors

      - name: Verify packaged native resources
        shell: pwsh
        run: |
          $required = @(
            'apps/desktop/src-tauri/resources/native-v034/tuwunel.exe',
            'apps/desktop/src-tauri/resources/native-v034/connectors/mautrix-whatsapp.exe',
            'apps/desktop/src-tauri/resources/native-v034/connectors/mautrix-telegram.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing native resource: $path" }
          }

      - name: Validate application
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build complete native Windows installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Stage release files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-native | Out-Null
          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          Copy-Item $installer.FullName 'dist-native/Unibox-Native-Setup.exe' -Force
          if (Test-Path 'target/release/unibox-desktop.exe') {
            Copy-Item 'target/release/unibox-desktop.exe' 'dist-native/Unibox-Native-Portable.exe' -Force
          }
          Get-ChildItem dist-native/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist-native/SHA256SUMS.txt -Encoding ascii
          Get-Content dist-native/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: unibox-native-windows-complete
          path: dist-native/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish native development release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.3.0-native-dev'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
          }
          $notes = @"
          WSL-free Unibox native Windows development build.

          Runtime:
          - Native Tuwunel Matrix engine bundled inside the installer
          - Native WhatsApp and Telegram mautrix connectors bundled inside the installer
          - Windows config replacement bug in mautrix/go-util is patched and regression-tested during the build
          - No WSL, Ubuntu, Docker, Hyper-V, apt, PostgreSQL or Python installation required
          - All runtime services bind locally and are managed by Unibox

          This is an unsigned development build. WhatsApp and Telegram are the native connectors exposed by this build; unsupported connector cards are not exposed in the desktop UI.
          "@
          gh release create $tag dist-native/* --target $env:GITHUB_SHA --title 'Unibox v0.3.0 Native Windows Dev' --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
