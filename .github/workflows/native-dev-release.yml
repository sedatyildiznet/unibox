name: Native Windows Development Release

on:
  push:
    branches:
      - native-runtime
    paths:
      - '.github/workflows/native-dev-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unibox-native-dev-release
  cancel-in-progress: false

env:
  TUWUNEL_REF: v1.9.0
  MAUTRIX_REF: v0.2608.0

jobs:
  build-tuwunel:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Checkout Tuwunel
        shell: pwsh
        run: git clone --depth 1 --branch $env:TUWUNEL_REF https://github.com/matrix-construct/tuwunel.git vendor/tuwunel

      - name: Configure build environment
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build native Tuwunel
        working-directory: vendor/tuwunel
        shell: pwsh
        run: cargo build --release --no-default-features

      - name: Stage Tuwunel
        shell: pwsh
        run: |
          $bin = Get-ChildItem vendor/tuwunel/target/release -Filter 'tuwunel.exe' -Recurse | Select-Object -First 1
          if (-not $bin) { throw 'tuwunel.exe was not produced' }
          New-Item -ItemType Directory -Force -Path native-tuwunel | Out-Null
          Copy-Item $bin.FullName native-tuwunel/tuwunel.exe -Force

      - name: Smoke test native Matrix engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'unibox-tuwunel-smoke'
          $db = Join-Path $root 'matrix'
          $apps = Join-Path $root 'appservices'
          New-Item -ItemType Directory -Force -Path $db, $apps | Out-Null
          $dbPosix = $db.Replace('\','/')
          $appsPosix = $apps.Replace('\','/')
          $config = Join-Path $root 'tuwunel.toml'
          @"
          [global]
          server_name = "unibox.local"
          database_path = "$dbPosix"
          address = ["127.0.0.1"]
          port = 18008
          allow_federation = false
          allow_registration = false
          create_admin_room = false
          new_user_displayname_suffix = ""
          appservice_dir = "$appsPosix"
          registration_shared_secret = "unibox-ci-native-smoke-secret"
          log = "warn,tuwunel=info"
          "@ | Set-Content -Path $config -Encoding utf8

          $stdout = Join-Path $root 'stdout.log'
          $stderr = Join-Path $root 'stderr.log'
          $proc = Start-Process -FilePath (Resolve-Path 'native-tuwunel/tuwunel.exe') -ArgumentList @('-c', $config) -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { break }
              try {
                $versions = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18008/_matrix/client/versions' -TimeoutSec 2
                if ($versions.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) {
              if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
              if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }
              throw 'Tuwunel did not become ready on Windows.'
            }
            $nonce = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18008/_synapse/admin/v1/register' -TimeoutSec 5
            if ($nonce.StatusCode -ne 200 -or $nonce.Content -notmatch 'nonce') {
              throw 'Synapse-compatible shared-secret registration endpoint is unavailable.'
            }
          }
          finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: native-tuwunel
          path: native-tuwunel/tuwunel.exe
          if-no-files-found: error
          retention-days: 3

  build-bridge:
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: whatsapp
            repo: mautrix/whatsapp
            ref: v0.2608.0
            package: ./cmd/mautrix-whatsapp
            output: mautrix-whatsapp.exe
            required: true
          - id: telegram
            repo: mautrix/telegram
            ref: v0.2608.0
            package: ./cmd/mautrix-telegram
            output: mautrix-telegram.exe
            required: true
          - id: signal
            repo: mautrix/signal
            ref: main
            package: ./cmd/mautrix-signal
            output: mautrix-signal.exe
            required: false
          - id: instagram
            repo: mautrix/meta
            ref: main
            package: ./cmd/mautrix-instagram
            output: mautrix-instagram.exe
            required: false
          - id: messenger
            repo: mautrix/meta
            ref: main
            package: ./cmd/mautrix-meta
            output: mautrix-meta.exe
            required: false
          - id: gmessages
            repo: mautrix/gmessages
            ref: main
            package: ./cmd/mautrix-gmessages
            output: mautrix-gmessages.exe
            required: false
          - id: slack
            repo: mautrix/slack
            ref: main
            package: ./cmd/mautrix-slack
            output: mautrix-slack.exe
            required: false
          - id: twitter
            repo: mautrix/twitter
            ref: main
            package: ./cmd/mautrix-twitter
            output: mautrix-twitter.exe
            required: false
          - id: bluesky
            repo: mautrix/bluesky
            ref: main
            package: ./cmd/mautrix-bluesky
            output: mautrix-bluesky.exe
            required: false
          - id: linkedin
            repo: mautrix/linkedin
            ref: main
            package: ./cmd/mautrix-linkedin
            output: mautrix-linkedin.exe
            required: false
          - id: gvoice
            repo: mautrix/gvoice
            ref: main
            package: ./cmd/mautrix-gvoice
            output: mautrix-gvoice.exe
            required: false
          - id: zulip
            repo: mautrix/zulip
            ref: main
            package: ./cmd/mautrix-zulip
            output: mautrix-zulip.exe
            required: false
          - id: irc
            repo: mautrix/irc
            ref: main
            package: ./cmd/mautrix-irc
            output: mautrix-irc.exe
            required: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Checkout bridge
        shell: pwsh
        run: git clone --depth 1 --branch ${{ matrix.ref }} https://github.com/${{ matrix.repo }}.git vendor/bridge

      - name: Patch mautrix config writer for Windows
        working-directory: vendor/bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $utilDir = (go list -m -f '{{.Dir}}' go.mau.fi/util).Trim()
          if (-not $utilDir -or -not (Test-Path $utilDir)) {
            throw 'Unable to locate go.mau.fi/util in the module cache.'
          }
          $upgrade = Join-Path $utilDir 'configupgrade\upgrade.go'
          if (-not (Test-Path $upgrade)) {
            throw "Unable to locate configupgrade/upgrade.go at $upgrade"
          }

          attrib -R $upgrade 2>$null
          $raw = Get-Content $upgrade -Raw
          if ($raw -notmatch 'tempFile\.Close\(\)') {
            $needle = "`terr = os.Rename(tempFile.Name(), configPath)"
            if (-not $raw.Contains($needle)) {
              throw 'Expected mautrix config replacement code was not found. Refusing to build an unverified Windows connector.'
            }
            $replacement = @"
          `terr = tempFile.Close()
          `tif err != nil {
          `t`t_ = os.Remove(tempFile.Name())
          `t`treturn output, true, fmt.Errorf("failed to close temp file before replacing config: %w", err)
          `t}
          `terr = os.Rename(tempFile.Name(), configPath)
          "@.Trim()
            $raw = $raw.Replace($needle, $replacement)
            Set-Content -Path $upgrade -Value $raw -NoNewline -Encoding utf8
          }
          gofmt -w $upgrade
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content $upgrade -Raw) -notmatch 'tempFile\.Close\(\)') {
            throw 'Windows config writer patch was not applied.'
          }

      - name: Build native bridge
        working-directory: vendor/bridge
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          New-Item -ItemType Directory -Force -Path ../../native-bridge | Out-Null
          go build -tags goolm -trimpath -ldflags="-s -w" -o ../../native-bridge/${{ matrix.output }} ${{ matrix.package }}

      - name: Verify bridge binary
        shell: pwsh
        run: |
          $path = 'native-bridge/${{ matrix.output }}'
          if (-not (Test-Path $path)) { throw '${{ matrix.output }} was not produced' }
          if ((Get-Item $path).Length -lt 1MB) { throw '${{ matrix.output }} is unexpectedly small' }

      - name: Regression test Windows config replacement and registration generation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'unibox-${{ matrix.id }}-config-smoke'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $config = Join-Path $root 'config.yaml'
          $registration = Join-Path $root 'registration.yaml'
          $exe = (Resolve-Path 'native-bridge/${{ matrix.output }}').Path

          & $exe -e -c $config
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $config)) {
            throw 'Bridge example config generation failed.'
          }

          $cfg = Get-Content $config -Raw
          $cfg = $cfg.Replace('domain: example.com', 'domain: unibox.local')
          $cfg = $cfg.Replace('http://example.localhost:8008', 'http://127.0.0.1:18008')
          Set-Content -Path $config -Value $cfg -NoNewline -Encoding utf8

          & $exe -g -c $config -r $registration
          if ($LASTEXITCODE -ne 0) {
            throw 'Bridge appservice registration generation failed on Windows.'
          }
          if (-not (Test-Path $registration)) {
            throw 'Bridge did not produce registration.yaml.'
          }
          $after = Get-Content $config -Raw
          if ($after -notmatch 'as_token:' -or $after -notmatch 'hs_token:') {
            throw 'Generated appservice tokens were not persisted to config.yaml.'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: native-bridge-${{ matrix.id }}
          path: native-bridge/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 3

  package:
    needs: [build-tuwunel, build-bridge]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: native-tuwunel
          path: apps/desktop/src-tauri/resources/native-v040

      - name: Download every native connector that passed the Windows build gate
        uses: actions/download-artifact@v4
        with:
          pattern: native-bridge-*
          path: apps/desktop/src-tauri/resources/native-v040/connectors
          merge-multiple: true

      - name: Configure app-level Telegram credentials
        shell: pwsh
        env:
          UNIBOX_TELEGRAM_API_ID: ${{ secrets.UNIBOX_TELEGRAM_API_ID }}
          UNIBOX_TELEGRAM_API_HASH: ${{ secrets.UNIBOX_TELEGRAM_API_HASH }}
        run: |
          $telegramExe = 'apps/desktop/src-tauri/resources/native-v040/connectors/mautrix-telegram.exe'
          $telegramApp = 'apps/desktop/src-tauri/resources/native-v040/telegram-app.json'
          if ([string]::IsNullOrWhiteSpace($env:UNIBOX_TELEGRAM_API_ID) -or
              [string]::IsNullOrWhiteSpace($env:UNIBOX_TELEGRAM_API_HASH)) {
            Write-Warning 'Telegram app credentials are not configured. Telegram will be omitted from this build instead of asking end users for developer keys.'
            Remove-Item $telegramExe -Force -ErrorAction SilentlyContinue
            Remove-Item $telegramApp -Force -ErrorAction SilentlyContinue
          } else {
            $apiId = 0
            if (-not [int64]::TryParse($env:UNIBOX_TELEGRAM_API_ID, [ref]$apiId) -or $apiId -le 0) {
              throw 'UNIBOX_TELEGRAM_API_ID must be a positive integer.'
            }
            $hash = $env:UNIBOX_TELEGRAM_API_HASH.Trim().ToLowerInvariant()
            if ($hash -notmatch '^[0-9a-f]{32}
      - name: Verify packaged native resources
        shell: pwsh
        run: |
          $required = @(
            'apps/desktop/src-tauri/resources/native-v040/tuwunel.exe',
            'apps/desktop/src-tauri/resources/native-v040/connectors/mautrix-whatsapp.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required native resource: $path" }
          }
          Write-Host 'Native connector binaries included in this installer:'
          Get-ChildItem 'apps/desktop/src-tauri/resources/native-v040/connectors/*.exe' |
            Sort-Object Name |
            ForEach-Object { Write-Host (" - " + $_.Name) }

      - name: Validate application
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build complete native Windows installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Stage release files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-native | Out-Null
          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          Copy-Item $installer.FullName 'dist-native/Unibox-Native-Setup.exe' -Force
          if (Test-Path 'target/release/unibox-desktop.exe') {
            Copy-Item 'target/release/unibox-desktop.exe' 'dist-native/Unibox-Native-Portable.exe' -Force
          }
          Get-ChildItem dist-native/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist-native/SHA256SUMS.txt -Encoding ascii
          Get-Content dist-native/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: unibox-native-windows-complete
          path: dist-native/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish native development release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.4.0-native-all'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
          }
          $notes = @"
          WSL-free Unibox native Windows development build.

          Runtime:
          - Native Tuwunel Matrix engine bundled inside the installer
          - WhatsApp is a mandatory native connector
          - Telegram is bundled only when Unibox app-level Telegram credentials are configured at build time; end users are never asked for API ID/hash
          - Signal, Instagram, Messenger, Google Messages, Slack, X/Twitter, Bluesky, LinkedIn, Google Voice, Zulip and IRC are built as native Windows candidates and automatically bundled when their upstream source passes the Windows build gate
          - Windows config replacement bug in mautrix/go-util is patched and regression-tested during the build
          - No WSL, Ubuntu, Docker, Hyper-V, apt, PostgreSQL or Python installation required
          - All runtime services bind locally and are managed by Unibox

          This is an unsigned development build. The desktop UI exposes every connector binary that actually passed the native Windows build gate and was bundled into the installer. Legacy Python-only Google Chat and legacy Discord are not falsely advertised as native BridgeV2 connectors.
          "@
          gh release create $tag dist-native/* --target $env:GITHUB_SHA --title 'Unibox v0.4.0 Native Windows All Services' --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
) {
              throw 'UNIBOX_TELEGRAM_API_HASH must be exactly 32 hexadecimal characters.'
            }
            @{ api_id = $apiId; api_hash = $hash } |
              ConvertTo-Json -Compress |
              Set-Content -Path $telegramApp -Encoding utf8
            Write-Host 'Bundled app-level Telegram credentials. End users will not be prompted for API ID/hash.'
          }


      - name: Verify packaged native resources
        shell: pwsh
        run: |
          $required = @(
            'apps/desktop/src-tauri/resources/native-v040/tuwunel.exe',
            'apps/desktop/src-tauri/resources/native-v040/connectors/mautrix-whatsapp.exe',
            'apps/desktop/src-tauri/resources/native-v040/connectors/mautrix-telegram.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required native resource: $path" }
          }
          Write-Host 'Native connector binaries included in this installer:'
          Get-ChildItem 'apps/desktop/src-tauri/resources/native-v040/connectors/*.exe' |
            Sort-Object Name |
            ForEach-Object { Write-Host (" - " + $_.Name) }

      - name: Validate application
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build complete native Windows installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Stage release files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-native | Out-Null
          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          Copy-Item $installer.FullName 'dist-native/Unibox-Native-Setup.exe' -Force
          if (Test-Path 'target/release/unibox-desktop.exe') {
            Copy-Item 'target/release/unibox-desktop.exe' 'dist-native/Unibox-Native-Portable.exe' -Force
          }
          Get-ChildItem dist-native/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist-native/SHA256SUMS.txt -Encoding ascii
          Get-Content dist-native/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: unibox-native-windows-complete
          path: dist-native/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish native development release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.4.0-native-all'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
          }
          $notes = @"
          WSL-free Unibox native Windows development build.

          Runtime:
          - Native Tuwunel Matrix engine bundled inside the installer
          - WhatsApp and Telegram are mandatory native connectors
          - Signal, Instagram, Messenger, Google Messages, Slack, X/Twitter, Bluesky, LinkedIn, Google Voice, Zulip and IRC are built as native Windows candidates and automatically bundled when their upstream source passes the Windows build gate
          - Windows config replacement bug in mautrix/go-util is patched and regression-tested during the build
          - No WSL, Ubuntu, Docker, Hyper-V, apt, PostgreSQL or Python installation required
          - All runtime services bind locally and are managed by Unibox

          This is an unsigned development build. The desktop UI exposes every connector binary that actually passed the native Windows build gate and was bundled into the installer. Legacy Python-only Google Chat and legacy Discord are not falsely advertised as native BridgeV2 connectors.
          "@
          gh release create $tag dist-native/* --target $env:GITHUB_SHA --title 'Unibox v0.4.0 Native Windows All Services' --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
