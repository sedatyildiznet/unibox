name: Native Fast Windows Release

on:
  push:
    branches:
      - native-runtime
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: unibox-native-fast-release
  cancel-in-progress: true

jobs:
  package-native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-runtime

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reuse verified native Tuwunel artifact
        uses: actions/download-artifact@v4
        with:
          name: tuwunel-windows-native
          path: apps/desktop/src-tauri/resources/native
          repository: sedatyildiznet/unibox
          run-id: 34465477705
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse verified native WhatsApp artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-whatsapp-windows-native
          path: apps/desktop/src-tauri/resources/native/connectors
          repository: sedatyildiznet/unibox
          run-id: 34465477705
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse verified native Telegram artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-telegram-windows-native
          path: apps/desktop/src-tauri/resources/native/connectors
          repository: sedatyildiznet/unibox
          run-id: 34465477705
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify native binaries
        shell: pwsh
        run: |
          $required = @(
            'apps/desktop/src-tauri/resources/native/tuwunel.exe',
            'apps/desktop/src-tauri/resources/native/connectors/mautrix-whatsapp.exe',
            'apps/desktop/src-tauri/resources/native/connectors/mautrix-telegram.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing native resource: $path" }
            if ((Get-Item $path).Length -lt 1MB) { throw "Native resource is unexpectedly small: $path" }
          }

      - name: Smoke test bundled Matrix engine on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'unibox-native-smoke'
          $db = Join-Path $root 'matrix'
          $apps = Join-Path $root 'appservices'
          New-Item -ItemType Directory -Force -Path $db, $apps | Out-Null
          $dbPosix = $db.Replace('\','/')
          $appsPosix = $apps.Replace('\','/')
          $config = Join-Path $root 'tuwunel.toml'
          @"
          [global]
          server_name = "unibox.local"
          database_path = "$dbPosix"
          address = ["127.0.0.1"]
          port = 18008
          allow_federation = false
          allow_registration = false
          create_admin_room = false
          new_user_displayname_suffix = ""
          appservice_dir = "$appsPosix"
          registration_shared_secret = "unibox-ci-native-smoke-secret"
          log = "warn,tuwunel=info"
          "@ | Set-Content -Path $config -Encoding utf8

          $stdout = Join-Path $root 'stdout.log'
          $stderr = Join-Path $root 'stderr.log'
          $proc = Start-Process -FilePath (Resolve-Path 'apps/desktop/src-tauri/resources/native/tuwunel.exe') -ArgumentList @('-c', $config) -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 80; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { break }
              try {
                $versions = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18008/_matrix/client/versions' -TimeoutSec 2
                if ($versions.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) {
              if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
              if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }
              throw 'Bundled Tuwunel did not become ready on Windows.'
            }
            $nonce = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18008/_synapse/admin/v1/register' -TimeoutSec 5
            if ($nonce.StatusCode -ne 200 -or $nonce.Content -notmatch 'nonce') {
              throw 'Native registration endpoint is unavailable.'
            }
          }
          finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Validate Unibox
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build WSL-free NSIS installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Stage release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-native | Out-Null
          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          Copy-Item $installer.FullName 'dist-native/Unibox-Native-Setup.exe' -Force
          if (Test-Path 'target/release/unibox-desktop.exe') {
            Copy-Item 'target/release/unibox-desktop.exe' 'dist-native/Unibox-Native-Portable.exe' -Force
          }
          Get-ChildItem dist-native/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist-native/SHA256SUMS.txt -Encoding ascii
          Get-Content dist-native/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: unibox-native-fast-windows
          path: dist-native/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish native prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.3.0-native-dev'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
          }
          $notes = @"
          Native Windows development build. WSL has been removed from the desktop runtime.

          Bundled locally:
          - Tuwunel Matrix engine
          - WhatsApp connector
          - Telegram connector

          No WSL, Ubuntu, Docker, Hyper-V, apt, PostgreSQL or Python installation is required.
          This build is unsigned and intended for native-runtime testing.
          "@
          gh release create $tag dist-native/* --target $env:GITHUB_SHA --title 'Unibox v0.3.0 Native Windows Dev' --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
