name: Native Runtime Format

on:
  push:
    branches:
      - native-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-runtime-format
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-runtime
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting when needed
        shell: pwsh
        run: |
          git diff --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Rust sources are already formatted.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.rs' 'apps/**/*.rs' 'crates/**/*.rs'
          git commit -m 'style: format native runtime Rust sources'
          git push origin HEAD:native-runtime
