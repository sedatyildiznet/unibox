name: Native Windows Installer Fix Release

on:
  push:
    branches:
      - release/native-hotfix
    paths:
      - '.github/workflows/native-hotfix-release.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: unibox-native-installerfix-release
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-runtime

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reuse verified native Tuwunel artifact
        uses: actions/download-artifact@v4
        with:
          name: tuwunel-windows-native
          path: apps/desktop/src-tauri/resources/native-v033
          repository: sedatyildiznet/unibox
          run-id: 34465477705
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use patched WhatsApp connector
        uses: actions/download-artifact@v4
        with:
          name: native-bridge-whatsapp
          path: apps/desktop/src-tauri/resources/native-v033/connectors
          repository: sedatyildiznet/unibox
          run-id: 34506961399
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use patched Telegram connector
        uses: actions/download-artifact@v4
        with:
          name: native-bridge-telegram
          path: apps/desktop/src-tauri/resources/native-v033/connectors
          repository: sedatyildiznet/unibox
          run-id: 34506961399
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify native resources and installer hook
        shell: pwsh
        run: |
          $required = @(
            'apps/desktop/src-tauri/resources/native-v033/tuwunel.exe',
            'apps/desktop/src-tauri/resources/native-v033/connectors/mautrix-whatsapp.exe',
            'apps/desktop/src-tauri/resources/native-v033/connectors/mautrix-telegram.exe',
            'apps/desktop/src-tauri/windows/hooks.nsh'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required resource: $path" }
          }
          foreach ($path in $required[0..2]) {
            if ((Get-Item $path).Length -lt 1MB) { throw "Native resource is unexpectedly small: $path" }
          }
          $tauri = Get-Content 'apps/desktop/src-tauri/tauri.conf.json' -Raw
          if ($tauri -notmatch '"installerHooks"\s*:\s*"\.\/windows\/hooks\.nsh"') {
            throw 'NSIS installerHooks is not wired to windows/hooks.nsh'
          }
          $hook = Get-Content 'apps/desktop/src-tauri/windows/hooks.nsh' -Raw
          foreach ($name in @('unibox-desktop.exe','tuwunel.exe','mautrix-whatsapp.exe','mautrix-telegram.exe')) {
            if ($hook -notmatch [regex]::Escape($name)) { throw "Installer hook does not stop $name" }
          }

      - name: Validate frontend and types
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build updated NSIS installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Stage release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-native | Out-Null
          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          Copy-Item $installer.FullName 'dist-native/Unibox-Native-Setup.exe' -Force
          if (Test-Path 'target/release/unibox-desktop.exe') {
            Copy-Item 'target/release/unibox-desktop.exe' 'dist-native/Unibox-Native-Portable.exe' -Force
          }
          Get-ChildItem dist-native/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist-native/SHA256SUMS.txt -Encoding ascii
          Get-Content dist-native/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: unibox-native-installerfix-windows
          path: dist-native/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish installer-fix release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.3.3-native-slotfix'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
          }
          $notes = @"
          WSL-free native Windows build with immutable runtime resource slots.

          Fixes:
          - bundles Tuwunel and native connectors under a new versioned resource directory, so Windows never needs to overwrite a currently-running runtime executable
          - new app startup stops only legacy Unibox runtime processes from the old resource path
          - preserves AppData message/session/database data
          - includes the latest native UI and connector fixes from native-runtime
          "@
          gh release create $tag dist-native/* --target 31a07c2be410539e938e9816313abb1aa80ebe53 --title 'Unibox v0.3.3 Native Windows Slot Fix' --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
