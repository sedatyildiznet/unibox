name: Native Windows Telegram Auth Hotfix

on:
  push:
    branches:
      - release/native-hotfix
    paths:
      - '.github/workflows/native-hotfix-release.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: unibox-native-telegram-hotfix
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-runtime

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reuse verified native Tuwunel artifact
        uses: actions/download-artifact@v4
        with:
          name: tuwunel-windows-native
          path: apps/desktop/src-tauri/resources/native-v034
          repository: sedatyildiznet/unibox
          run-id: 34465477705
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use patched WhatsApp connector
        uses: actions/download-artifact@v4
        with:
          name: native-bridge-whatsapp
          path: apps/desktop/src-tauri/resources/native-v034/connectors
          repository: sedatyildiznet/unibox
          run-id: 34506961399
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use patched Telegram connector
        uses: actions/download-artifact@v4
        with:
          name: native-bridge-telegram
          path: apps/desktop/src-tauri/resources/native-v034/connectors
          repository: sedatyildiznet/unibox
          run-id: 34506961399
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Telegram and provisioning fixes
        shell: pwsh
        run: |
          $required = @(
            'apps/desktop/src-tauri/resources/native-v034/tuwunel.exe',
            'apps/desktop/src-tauri/resources/native-v034/connectors/mautrix-whatsapp.exe',
            'apps/desktop/src-tauri/resources/native-v034/connectors/mautrix-telegram.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing native resource: $path" }
          }
          $runtime = Get-Content 'apps/desktop/src-tauri/src/native_runtime.rs' -Raw
          if ($runtime -notmatch 'append_pair\("user_id",\s*&session\.user_id\)') {
            throw 'BridgeV2 provisioning user_id authentication fix is missing.'
          }
          $lib = Get-Content 'apps/desktop/src-tauri/src/lib.rs' -Raw
          if ($lib -notmatch 'repair_telegram_root_credentials') {
            throw 'Telegram root credential repair is missing.'
          }
          if ($runtime -notmatch 'Telegram API ID' -or $runtime -notmatch 'Telegram API Hash') {
            throw 'Telegram API credential UI requirements are missing.'
          }

      - name: Validate application
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Stage release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-native | Out-Null
          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          Copy-Item $installer.FullName 'dist-native/Unibox-Native-Setup.exe' -Force
          if (Test-Path 'target/release/unibox-desktop.exe') {
            Copy-Item 'target/release/unibox-desktop.exe' 'dist-native/Unibox-Native-Portable.exe' -Force
          }
          Get-ChildItem dist-native/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist-native/SHA256SUMS.txt -Encoding ascii
          Get-Content dist-native/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: unibox-native-v034-hotfix
          path: dist-native/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.3.4-native-telegramfix'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
          }
          $notes = @"
          Native Windows hotfix.

          Fixes:
          - WhatsApp/BridgeV2 provisioning now supplies the Matrix user_id required for access-token authentication
          - Telegram now asks for the user's API ID and API hash before connector startup
          - Telegram api_id/api_hash are repaired into the top level expected by current mautrix-telegram
          - existing local Matrix and connector data are preserved
          "@
          gh release create $tag dist-native/* --target c469837ec5ac1841b5fac4f0122cc1669a3a1b06 --title 'Unibox v0.3.4 Native Telegram/Auth Fix' --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
