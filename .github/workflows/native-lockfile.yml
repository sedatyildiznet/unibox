name: Native Runtime Lockfile

on:
  push:
    branches:
      - native-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-runtime-lockfile
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-runtime
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh Cargo.lock
        run: cargo generate-lockfile
      - name: Commit lockfile when dependencies changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh native runtime lockfile"
          git push origin HEAD:native-runtime
