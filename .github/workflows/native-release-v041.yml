name: Native Windows v0.4.1 Release

on:
  push:
    branches:
      - native-runtime
    paths:
      - '.github/workflows/native-release-v041.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: unibox-native-v041-release
  cancel-in-progress: true

jobs:
  optional-bridges:
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: signal
            repo: mautrix/signal
            package: ./cmd/mautrix-signal
            output: mautrix-signal.exe
          - id: instagram
            repo: mautrix/meta
            package: ./cmd/mautrix-instagram
            output: mautrix-instagram.exe
          - id: messenger
            repo: mautrix/meta
            package: ./cmd/mautrix-meta
            output: mautrix-meta.exe
          - id: gmessages
            repo: mautrix/gmessages
            package: ./cmd/mautrix-gmessages
            output: mautrix-gmessages.exe
          - id: slack
            repo: mautrix/slack
            package: ./cmd/mautrix-slack
            output: mautrix-slack.exe
          - id: twitter
            repo: mautrix/twitter
            package: ./cmd/mautrix-twitter
            output: mautrix-twitter.exe
          - id: bluesky
            repo: mautrix/bluesky
            package: ./cmd/mautrix-bluesky
            output: mautrix-bluesky.exe
          - id: linkedin
            repo: mautrix/linkedin
            package: ./cmd/mautrix-linkedin
            output: mautrix-linkedin.exe
          - id: gvoice
            repo: mautrix/gvoice
            package: ./cmd/mautrix-gvoice
            output: mautrix-gvoice.exe
          - id: zulip
            repo: mautrix/zulip
            package: ./cmd/mautrix-zulip
            output: mautrix-zulip.exe
          - id: irc
            repo: mautrix/irc
            package: ./cmd/mautrix-irc
            output: mautrix-irc.exe
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Checkout bridge
        shell: pwsh
        run: git clone --depth 1 https://github.com/${{ matrix.repo }}.git bridge

      - name: Patch mautrix config writer for Windows
        working-directory: bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $utilDir = (go list -m -f '{{.Dir}}' go.mau.fi/util).Trim()
          if ($utilDir -and (Test-Path (Join-Path $utilDir 'configupgrade\upgrade.go'))) {
            $upgrade = Join-Path $utilDir 'configupgrade\upgrade.go'
            attrib -R $upgrade 2>$null
            $raw = Get-Content $upgrade -Raw
            if ($raw -notmatch 'tempFile\.Close\(\)') {
              $needle = "`terr = os.Rename(tempFile.Name(), configPath)"
              if ($raw.Contains($needle)) {
                $replacement = @"
          `terr = tempFile.Close()
          `tif err != nil {
          `t`t_ = os.Remove(tempFile.Name())
          `t`treturn output, true, fmt.Errorf("failed to close temp file before replacing config: %w", err)
          `t}
          `terr = os.Rename(tempFile.Name(), configPath)
          "@.Trim()
                $raw = $raw.Replace($needle, $replacement)
                Set-Content -Path $upgrade -Value $raw -NoNewline -Encoding utf8
                gofmt -w $upgrade
              }
            }
          }

      - name: Build bridge
        working-directory: bridge
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          New-Item -ItemType Directory -Force -Path ../out | Out-Null
          go build -tags goolm -trimpath -ldflags="-s -w" -o ../out/${{ matrix.output }} ${{ matrix.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: optional-${{ matrix.id }}
          path: out/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7

  package:
    needs:
      - optional-bridges
    if: always()
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-runtime

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified Tuwunel
        uses: actions/download-artifact@v4
        with:
          name: tuwunel-windows-native
          path: apps/desktop/src-tauri/resources/native-v041
          repository: sedatyildiznet/unibox
          run-id: 34465477705
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download verified WhatsApp bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-whatsapp-windows-native
          path: apps/desktop/src-tauri/resources/native-v041/connectors
          repository: sedatyildiznet/unibox
          run-id: 34465477705
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download verified Telegram bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-telegram-windows-native
          path: apps/desktop/src-tauri/resources/native-v041/connectors
          repository: sedatyildiznet/unibox
          run-id: 34465477705
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download optional bridges that passed
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: optional-*
          path: apps/desktop/src-tauri/resources/native-v041/connectors
          merge-multiple: true

      - name: Configure app-level Telegram credentials
        shell: pwsh
        env:
          TG_ID: ${{ secrets.UNIBOX_TELEGRAM_API_ID }}
          TG_HASH: ${{ secrets.UNIBOX_TELEGRAM_API_HASH }}
        run: |
          $telegramExe = 'apps/desktop/src-tauri/resources/native-v041/connectors/mautrix-telegram.exe'
          $telegramApp = 'apps/desktop/src-tauri/resources/native-v041/telegram-app.json'
          if ([string]::IsNullOrWhiteSpace($env:TG_ID) -or [string]::IsNullOrWhiteSpace($env:TG_HASH)) {
            throw 'Unibox Telegram app credentials are not configured. Refusing to ship a build that asks end users for API credentials or hides Telegram.'
          } else {
            $parsedId = 0L
            if (-not [long]::TryParse($env:TG_ID, [ref]$parsedId) -or $parsedId -le 0) {
              throw 'UNIBOX_TELEGRAM_API_ID must be a positive integer.'
            }
            $hash = $env:TG_HASH.Trim().ToLowerInvariant()
            if ($hash -notmatch '^[0-9a-f]{32}$') {
              throw 'UNIBOX_TELEGRAM_API_HASH must be 32 hexadecimal characters.'
            }
            @{ api_id = $parsedId; api_hash = $hash } |
              ConvertTo-Json -Compress |
              Set-Content -Path $telegramApp -Encoding utf8
          }

      - name: Verify runtime payload
        shell: pwsh
        run: |
          $mustExist = @(
            'apps/desktop/src-tauri/resources/native-v041/tuwunel.exe',
            'apps/desktop/src-tauri/resources/native-v041/connectors/mautrix-whatsapp.exe'
          )
          foreach ($path in $mustExist) {
            if (-not (Test-Path $path)) { throw "Missing required runtime file: $path" }
          }
          Write-Host 'Bundled connectors:'
          Get-ChildItem 'apps/desktop/src-tauri/resources/native-v041/connectors/*.exe' |
            Sort-Object Name |
            ForEach-Object { Write-Host (" - " + $_.Name) }

      - name: Validate application
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Stage release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer was not produced.' }
          Copy-Item $installer.FullName 'dist/Unibox-Native-Setup.exe' -Force
          if (Test-Path 'target/release/unibox-desktop.exe') {
            Copy-Item 'target/release/unibox-desktop.exe' 'dist/Unibox-Native-Portable.exe' -Force
          }
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: unibox-v041-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag='v0.4.1-authfix'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
          }
          gh release create $tag dist/* --target $env:GITHUB_SHA --title 'Unibox v0.4.1 Native Auth Fix' --prerelease --notes @"
          Native Windows authentication fix.

          - WhatsApp QR confirmation no longer uses the broken 4-second provisioning timeout.
          - BridgeV2 display-and-wait login is allowed to remain open for the full pairing window.
          - Telegram developer API credentials are app-level build credentials, never an end-user setup form.
          - If Telegram app credentials are not configured for the build, Telegram is hidden rather than shown broken.
          - Native Mautrix connector candidates that successfully build on Windows are bundled automatically.
          "@
