name: Native Windows v0.4.2 Fast Release

on:
  push:
    branches:
      - native-runtime
    paths:
      - '.github/workflows/native-release-v042-fast.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: unibox-native-v042-fast
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-runtime

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reuse verified native Tuwunel
        uses: actions/download-artifact@v4
        with:
          name: tuwunel-windows-native
          path: apps/desktop/src-tauri/resources/native-v042
          repository: sedatyildiznet/unibox
          run-id: 34465477705
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse verified WhatsApp bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-whatsapp-windows-native
          path: apps/desktop/src-tauri/resources/native-v042/connectors
          repository: sedatyildiznet/unibox
          run-id: 34465477705
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse verified Telegram bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-telegram-windows-native
          path: apps/desktop/src-tauri/resources/native-v042/connectors
          repository: sedatyildiznet/unibox
          run-id: 34465477705
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse previously verified expanded native connectors
        uses: actions/download-artifact@v4
        with:
          pattern: native-ext-*
          path: apps/desktop/src-tauri/resources/native-v042/connectors
          merge-multiple: true
          repository: sedatyildiznet/unibox
          run-id: 34526746751
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Telegram app credentials
        shell: pwsh
        env:
          TG_ID: ${{ secrets.UNIBOX_TELEGRAM_API_ID }}
          TG_HASH: ${{ secrets.UNIBOX_TELEGRAM_API_HASH }}
        run: |
          $telegramExe = 'apps/desktop/src-tauri/resources/native-v042/connectors/mautrix-telegram.exe'
          $telegramApp = 'apps/desktop/src-tauri/resources/native-v042/telegram-app.json'
          if ([string]::IsNullOrWhiteSpace($env:TG_ID) -or [string]::IsNullOrWhiteSpace($env:TG_HASH)) {
            Write-Warning 'Unibox Telegram app credentials are not configured; Telegram is omitted instead of asking end users for API credentials.'
            Remove-Item $telegramExe -Force -ErrorAction SilentlyContinue
            Remove-Item $telegramApp -Force -ErrorAction SilentlyContinue
          } else {
            $parsedId = 0L
            if (-not [long]::TryParse($env:TG_ID, [ref]$parsedId) -or $parsedId -le 0) {
              throw 'UNIBOX_TELEGRAM_API_ID must be a positive integer.'
            }
            $hash = $env:TG_HASH.Trim().ToLowerInvariant()
            if ($hash -notmatch '^[0-9a-f]{32}$') {
              throw 'UNIBOX_TELEGRAM_API_HASH must be 32 hexadecimal characters.'
            }
            @{ api_id = $parsedId; api_hash = $hash } |
              ConvertTo-Json -Compress |
              Set-Content -Path $telegramApp -Encoding utf8
            Write-Host 'Telegram app credentials bundled. End users will use phone-number login.'
          }

      - name: Verify bundled runtime
        shell: pwsh
        run: |
          $required = @(
            'apps/desktop/src-tauri/resources/native-v042/tuwunel.exe',
            'apps/desktop/src-tauri/resources/native-v042/connectors/mautrix-whatsapp.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required runtime file: $path" }
          }
          Write-Host 'Bundled native connectors:'
          Get-ChildItem 'apps/desktop/src-tauri/resources/native-v042/connectors/*.exe' |
            Sort-Object Name |
            ForEach-Object { Write-Host (" - " + $_.Name) }

      - name: Validate frontend and types
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows NSIS installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          Copy-Item $installer.FullName 'dist/Unibox-Native-Setup.exe' -Force
          if (Test-Path 'target/release/unibox-desktop.exe') {
            Copy-Item 'target/release/unibox-desktop.exe' 'dist/Unibox-Native-Portable.exe' -Force
          }
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: unibox-v042-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag='v0.4.2-authfix'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
          }
          gh release create $tag dist/* --target $env:GITHUB_SHA --title 'Unibox v0.4.2 Native Auth Fix' --prerelease --notes @"
          WSL-free native Windows build.

          Fixes:
          - WhatsApp QR display-and-wait no longer dies after the old 4-second provisioning timeout.
          - WhatsApp QR pairing gets a long-lived confirmation request and full connector log errors.
          - Telegram never asks end users for API ID/API hash.
          - When Unibox app-level Telegram credentials are configured, Telegram opens directly to phone-number login.
          - If those app-level credentials are not configured, Telegram is omitted rather than exposed broken.
          - Includes previously Windows-verified native Mautrix connectors from the expanded connector build.
          "@
