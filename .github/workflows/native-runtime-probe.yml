name: Native Runtime Probe

on:
  push:
    branches:
      - native-runtime
    paths:
      - '.github/workflows/native-runtime-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-runtime-probe
  cancel-in-progress: true

jobs:
  tuwunel-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Checkout Tuwunel
        shell: pwsh
        run: git clone --depth 1 --branch v1.9.0 https://github.com/matrix-construct/tuwunel.git vendor/tuwunel

      - name: Configure native build environment
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable Tuwunel for Windows
        working-directory: vendor/tuwunel
        shell: pwsh
        run: cargo build --release --no-default-features

      - name: Locate binary
        shell: pwsh
        run: |
          $bin = Get-ChildItem vendor/tuwunel/target/release -Filter 'tuwunel.exe' -Recurse | Select-Object -First 1
          if (-not $bin) { throw 'tuwunel.exe was not produced' }
          New-Item -ItemType Directory -Force -Path native-runtime-artifact | Out-Null
          Copy-Item $bin.FullName native-runtime-artifact/tuwunel.exe

      - uses: actions/upload-artifact@v4
        with:
          name: tuwunel-windows-native
          path: native-runtime-artifact/tuwunel.exe
          if-no-files-found: error
          retention-days: 3

  bridge-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: whatsapp
            repo: mautrix/whatsapp
            ref: v0.2608.0
            package: ./cmd/mautrix-whatsapp
            output: mautrix-whatsapp.exe
          - id: telegram
            repo: mautrix/telegram
            ref: v0.2608.0
            package: ./cmd/mautrix-telegram
            output: mautrix-telegram.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Checkout bridge
        shell: pwsh
        run: git clone --depth 1 --branch ${{ matrix.ref }} https://github.com/${{ matrix.repo }}.git vendor/bridge

      - name: Build bridge for Windows
        working-directory: vendor/bridge
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          New-Item -ItemType Directory -Force -Path ../../native-runtime-artifact | Out-Null
          go build -tags goolm -trimpath -ldflags="-s -w" -o ../../native-runtime-artifact/${{ matrix.output }} ${{ matrix.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.id }}-windows-native
          path: native-runtime-artifact/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 3
