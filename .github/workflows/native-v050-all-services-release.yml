name: Native Windows v0.5.0 All Services

on:
  push:
    branches:
      - native-runtime
    paths:
      - '.github/workflows/native-v050-all-services-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: unibox-v050-native-all
  cancel-in-progress: true

env:
  NATIVE_SLOT: apps/desktop/src-tauri/resources/native-v050

jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Validate source
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify v0.5.0 native-only resource contract
        shell: pwsh
        run: |
          $tauri = Get-Content 'apps/desktop/src-tauri/tauri.conf.json' -Raw
          if ($tauri -notmatch '"version"\s*:\s*"0\.5\.0"') { throw 'Tauri version is not 0.5.0.' }
          if ($tauri -notmatch 'resources/native-v050/\*\*/\*') { throw 'Tauri does not package native-v050.' }
          $lib = Get-Content 'apps/desktop/src-tauri/src/lib.rs' -Raw
          if ($lib -notmatch '\.join\("native-v050"\)') { throw 'Rust runtime does not use native-v050.' }

  tuwunel:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Tuwunel for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 --branch v1.9.0 https://github.com/matrix-construct/tuwunel.git vendor/tuwunel
          $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'
          $env:CMAKE_GENERATOR = 'Ninja'
          Push-Location vendor/tuwunel
          cargo build --release --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $bin = Get-ChildItem vendor/tuwunel/target/release -Filter 'tuwunel.exe' -Recurse | Select-Object -First 1
          if (-not $bin) { throw 'tuwunel.exe was not produced.' }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $bin.FullName artifact/tuwunel.exe
      - name: Smoke Tuwunel on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'unibox-tuwunel-v050-smoke'
          $db = Join-Path $root 'matrix'
          $apps = Join-Path $root 'appservices'
          New-Item -ItemType Directory -Force -Path $db,$apps | Out-Null
          $config = Join-Path $root 'tuwunel.toml'
          $dbp = $db.Replace('\','/')
          $appsp = $apps.Replace('\','/')
          @"
          [global]
          server_name = "unibox.local"
          database_path = "$dbp"
          address = ["127.0.0.1"]
          port = 18008
          allow_federation = false
          allow_registration = false
          create_admin_room = false
          appservice_dir = "$appsp"
          registration_shared_secret = "unibox-v050-smoke"
          log = "warn"
          "@ | Set-Content $config -Encoding utf8
          $proc = Start-Process -FilePath (Resolve-Path 'artifact/tuwunel.exe') -ArgumentList @('-c',$config) -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 120; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { break }
              try {
                $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18008/_matrix/client/versions' -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw 'Tuwunel did not become ready on Windows.' }
            $nonce = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18008/_synapse/admin/v1/register' -TimeoutSec 5
            if ($nonce.StatusCode -ne 200 -or $nonce.Content -notmatch 'nonce') {
              throw 'Tuwunel shared-secret registration endpoint failed.'
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-v050-tuwunel
          path: artifact/tuwunel.exe
          if-no-files-found: error
          retention-days: 7

  go-connectors:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: whatsapp, repo: mautrix/whatsapp, package: ./cmd/mautrix-whatsapp, output: mautrix-whatsapp.exe }
          - { id: telegram, repo: mautrix/telegram, package: ./cmd/mautrix-telegram, output: mautrix-telegram.exe }
          - { id: instagram, repo: mautrix/meta, package: ./cmd/mautrix-instagram, output: mautrix-instagram.exe }
          - { id: messenger, repo: mautrix/meta, package: ./cmd/mautrix-meta, output: mautrix-meta.exe }
          - { id: gmessages, repo: mautrix/gmessages, package: ./cmd/mautrix-gmessages, output: mautrix-gmessages.exe }
          - { id: slack, repo: mautrix/slack, package: ./cmd/mautrix-slack, output: mautrix-slack.exe }
          - { id: twitter, repo: mautrix/twitter, package: ./cmd/mautrix-twitter, output: mautrix-twitter.exe }
          - { id: bluesky, repo: mautrix/bluesky, package: ./cmd/mautrix-bluesky, output: mautrix-bluesky.exe }
          - { id: linkedin, repo: mautrix/linkedin, package: ./cmd/mautrix-linkedin, output: mautrix-linkedin.exe }
          - { id: gvoice, repo: mautrix/gvoice, package: ./cmd/mautrix-gvoice, output: mautrix-gvoice.exe }
          - { id: zulip, repo: mautrix/zulip, package: ./cmd/mautrix-zulip, output: mautrix-zulip.exe }
          - { id: irc, repo: mautrix/irc, package: ./cmd/mautrix-irc, output: mautrix-irc.exe }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Checkout upstream connector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/${{ matrix.repo }}.git vendor/bridge
          Push-Location vendor/bridge
          Write-Host "Upstream commit: $((git rev-parse HEAD).Trim())"
          Pop-Location
      - name: Build native Windows connector
        working-directory: vendor/bridge
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $utilDir = (go list -m -f '{{.Dir}}' go.mau.fi/util).Trim()
          if ($utilDir -and (Test-Path $utilDir)) {
            $upgrade = Join-Path $utilDir 'configupgrade\upgrade.go'
            if (Test-Path $upgrade) {
              attrib -R $upgrade 2>$null
              $raw = Get-Content $upgrade -Raw
              if ($raw -notmatch 'tempFile\.Close\(\)') {
                $needle = "`terr = os.Rename(tempFile.Name(), configPath)"
                if ($raw.Contains($needle)) {
                  $replacement = @(
                    'err = tempFile.Close()',
                    'if err != nil {',
                    '    _ = os.Remove(tempFile.Name())',
                    '    return output, true, fmt.Errorf("failed to close temp file before replacing config: %w", err)',
                    '}',
                    'err = os.Rename(tempFile.Name(), configPath)'
                  ) -join [Environment]::NewLine
                  $raw = $raw.Replace($needle, $replacement.Trim())
                  Set-Content $upgrade -Value $raw -NoNewline -Encoding utf8
                  gofmt -w $upgrade
                }
              }
            }
          }

          New-Item -ItemType Directory -Force -Path ../../artifact | Out-Null
          go build -tags goolm -trimpath -ldflags="-s -w" -o ../../artifact/${{ matrix.output }} ${{ matrix.package }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke config and registration generation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'artifact/${{ matrix.output }}').Path
          if ((Get-Item $exe).Length -lt 1MB) { throw 'Connector binary is unexpectedly small.' }
          $root = Join-Path $env:RUNNER_TEMP 'unibox-${{ matrix.id }}-config-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $cfg = Join-Path $root 'config.yaml'
          $reg = Join-Path $root 'registration.yaml'
          & $exe -e -c $cfg
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $cfg)) { throw 'Example config generation failed.' }
          & ./scripts/ci/patch-generated-matrix-config.ps1 -Path $cfg
          & $exe -g -c $cfg -r $reg
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $reg)) { throw 'Registration generation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: connector-v050-${{ matrix.id }}
          path: artifact/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7

  signal:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install Signal build prerequisite
        shell: pwsh
        run: choco install protoc -y --no-progress
      - name: Build libsignal FFI and Signal connector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 --recurse-submodules https://github.com/mautrix/signal.git vendor/signal
          Set-Location vendor/signal
          git submodule update --init --recursive
          Write-Host "Signal upstream commit: $((git rev-parse HEAD).Trim())"

          $mingwBin = @('C:\mingw64\bin','C:\msys64\mingw64\bin') |
            Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } |
            Select-Object -First 1
          if (-not $mingwBin) { throw 'A MinGW64 GCC toolchain is required on the GitHub Windows runner.' }
          $env:PATH = "$mingwBin;$env:PATH"

          $libsignal = Join-Path (Get-Location) 'pkg/libsignalgo/libsignal'
          $ffiCargo = Join-Path $libsignal 'rust/bridge/ffi/Cargo.toml'
          $ffiCargoRaw = Get-Content $ffiCargo -Raw
          if ($ffiCargoRaw -notmatch 'crate-type = \["staticlib"\]') {
            throw 'libsignal FFI crate layout changed upstream.'
          }
          $ffiCargoRaw = $ffiCargoRaw.Replace('crate-type = ["staticlib"]','crate-type = ["staticlib", "cdylib"]')
          Set-Content $ffiCargo -Value $ffiCargoRaw -NoNewline -Encoding utf8

          $env:CC_x86_64_pc_windows_gnu = Join-Path $mingwBin 'gcc.exe'
          $env:CXX_x86_64_pc_windows_gnu = Join-Path $mingwBin 'g++.exe'
          $env:AR_x86_64_pc_windows_gnu = Join-Path $mingwBin 'ar.exe'
          $env:CMAKE_GENERATOR = 'MinGW Makefiles'
          $env:CMAKE_C_COMPILER = Join-Path $mingwBin 'gcc.exe'
          $env:CMAKE_CXX_COMPILER = Join-Path $mingwBin 'g++.exe'
          $env:RUSTC_WRAPPER = ''
          $env:RUSTFLAGS = '-Ctarget-feature=-crt-static'
          Push-Location $libsignal
          rustup target add x86_64-pc-windows-gnu
          cargo build -p libsignal-ffi --release --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          $ffiDir = Join-Path $libsignal 'target/x86_64-pc-windows-gnu/release'
          $ffiImport = Join-Path $ffiDir 'libsignal_ffi.dll.a'
          $ffiDll = Join-Path $ffiDir 'signal_ffi.dll'
          if (-not (Test-Path $ffiImport)) { throw "Missing libsignal import library: $ffiImport" }
          if (-not (Test-Path $ffiDll)) { throw "Missing libsignal DLL: $ffiDll" }

          $cflags = 'pkg/libsignalgo/cflags.go'
          $raw = Get-Content $cflags -Raw
          $needle = '#cgo LDFLAGS: -lsignal_ffi -ldl -lm -lz -lstdc++'
          if (-not $raw.Contains($needle)) { throw 'Signal cgo LDFLAGS layout changed upstream.' }
          $replacement = '#cgo !windows LDFLAGS: -lsignal_ffi -ldl -lm -lz -lstdc++' + [Environment]::NewLine + '#cgo windows LDFLAGS: -lsignal_ffi'
          $raw = $raw.Replace($needle,$replacement)
          Set-Content $cflags -Value $raw -NoNewline -Encoding utf8
          gofmt -w $cflags

          $env:LIBRARY_PATH = "$ffiDir;$env:LIBRARY_PATH"
          $env:CGO_ENABLED = '1'
          New-Item -ItemType Directory -Force -Path ../../artifact | Out-Null
          go build -tags goolm -trimpath -ldflags='-s -w' -o ../../artifact/mautrix-signal.exe ./cmd/mautrix-signal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $ffiDll ../../artifact/signal_ffi.dll

          $objdump = Join-Path $mingwBin 'objdump.exe'
          if (Test-Path $objdump) {
            $imports = & $objdump -p $ffiDll |
              Select-String 'DLL Name:' |
              ForEach-Object { ($_.Line -split 'DLL Name:')[1].Trim() }
            foreach ($name in @('libgcc_s_seh-1.dll','libstdc++-6.dll','libwinpthread-1.dll','libssp-0.dll')) {
              if ($imports -contains $name) {
                $source = Join-Path $mingwBin $name
                if (-not (Test-Path $source)) { throw "Signal runtime dependency $name was imported but not found." }
                Copy-Item $source ../../artifact/$name
              }
            }
          }
      - name: Smoke Signal config and registration
        shell: pwsh
        run: |
          $env:PATH = "$(Resolve-Path artifact);$env:PATH"
          $root = Join-Path $env:RUNNER_TEMP 'unibox-signal-config-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $cfg = Join-Path $root 'config.yaml'
          $reg = Join-Path $root 'registration.yaml'
          & ./artifact/mautrix-signal.exe -e -c $cfg
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $cfg)) { throw 'Signal config generation failed.' }
          & ./scripts/ci/patch-generated-matrix-config.ps1 -Path $cfg
          & ./artifact/mautrix-signal.exe -g -c $cfg -r $reg
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $reg)) { throw 'Signal registration generation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: connector-v050-signal
          path: artifact/*
          if-no-files-found: error
          retention-days: 7

  discord:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build legacy Discord bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/mautrix/discord.git vendor/discord
          git clone --depth 1 --branch 3.2.16 https://gitlab.matrix.org/matrix-org/olm.git vendor/olm
          $mingwBin = @('C:\mingw64\bin','C:\msys64\mingw64\bin') |
            Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } |
            Select-Object -First 1
          if (-not $mingwBin) { throw 'A MinGW64 GCC toolchain is required on the GitHub Windows runner.' }
          $env:PATH = "$mingwBin;$env:PATH"

          $olmRoot = (Resolve-Path 'vendor/olm').Path
          $olmBuild = Join-Path $olmRoot 'build-mingw'
          cmake -S $olmRoot -B $olmBuild -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $olmBuild --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $olmLib = Get-ChildItem $olmBuild -Recurse -File | Where-Object { $_.Name -in @('libolm.a','olm.a') } | Select-Object -First 1
          if (-not $olmLib) { throw 'MinGW libolm static library was not produced.' }

          Set-Location vendor/discord
          Write-Host "Discord upstream commit: $((git rev-parse HEAD).Trim())"
          go mod download
          go get go.mau.fi/zeroconfig@latest
          go mod tidy
          $env:CGO_ENABLED = '1'
          $env:CC = Join-Path $mingwBin 'gcc.exe'
          $env:CXX = Join-Path $mingwBin 'g++.exe'
          $env:CGO_CFLAGS = "-I$($olmRoot.Replace('\','/'))/include"
          $env:CGO_LDFLAGS = "-L$($olmLib.DirectoryName.Replace('\','/'))"
          New-Item -ItemType Directory -Force -Path ../../artifact | Out-Null
          go build -trimpath -ldflags='-s -w' -o ../../artifact/mautrix-discord.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke Discord config and registration
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'unibox-discord-config-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $cfg = Join-Path $root 'config.yaml'
          $reg = Join-Path $root 'registration.yaml'
          & ./artifact/mautrix-discord.exe -e -c $cfg
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $cfg)) { throw 'Discord config generation failed.' }
          & ./scripts/ci/patch-generated-matrix-config.ps1 -Path $cfg
          & ./artifact/mautrix-discord.exe -g -c $cfg -r $reg
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $reg)) { throw 'Discord registration generation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: connector-v050-discord
          path: artifact/mautrix-discord.exe
          if-no-files-found: error
          retention-days: 7

  googlechat:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build standalone Google Chat bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/mautrix/googlechat.git vendor/googlechat
          Set-Location vendor/googlechat
          Write-Host "Google Chat upstream commit: $((git rev-parse HEAD).Trim())"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          Set-Content unibox_googlechat_launcher.py -Value 'import runpy; runpy.run_module("mautrix_googlechat", run_name="__main__")' -Encoding utf8
          pyinstaller --noconfirm --clean --onefile --name mautrix-googlechat --collect-all mautrix --collect-all mautrix_googlechat --collect-all maugclib unibox_googlechat_launcher.py
          New-Item -ItemType Directory -Force -Path ../../artifact | Out-Null
          Copy-Item dist/mautrix-googlechat.exe ../../artifact/mautrix-googlechat.exe
      - name: Smoke Google Chat config and registration
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'unibox-googlechat-config-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $cfg = Join-Path $root 'config.yaml'
          $reg = Join-Path $root 'registration.yaml'
          & ./artifact/mautrix-googlechat.exe -e -c $cfg
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $cfg)) { throw 'Google Chat config generation failed.' }
          & ./scripts/ci/patch-generated-matrix-config.ps1 -Path $cfg
          & ./artifact/mautrix-googlechat.exe -g -c $cfg -r $reg
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $reg)) { throw 'Google Chat registration generation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: connector-v050-googlechat
          path: artifact/mautrix-googlechat.exe
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [tuwunel, go-connectors, signal, discord, googlechat]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: runtime-v050-tuwunel
          path: ${{ env.NATIVE_SLOT }}
      - uses: actions/download-artifact@v4
        with:
          pattern: connector-v050-*
          path: ${{ env.NATIVE_SLOT }}/connectors
          merge-multiple: true

      - name: Bundle Telegram application credentials
        shell: pwsh
        env:
          TG_ID: ${{ secrets.UNIBOX_TELEGRAM_API_ID }}
          TG_HASH: ${{ secrets.UNIBOX_TELEGRAM_API_HASH }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TG_ID) -or [string]::IsNullOrWhiteSpace($env:TG_HASH)) {
            throw 'Missing repository secrets UNIBOX_TELEGRAM_API_ID and/or UNIBOX_TELEGRAM_API_HASH. End users must never be asked for these credentials.'
          }
          $parsed = 0L
          if (-not [long]::TryParse($env:TG_ID,[ref]$parsed) -or $parsed -le 0) {
            throw 'UNIBOX_TELEGRAM_API_ID must be a positive integer.'
          }
          $hash = $env:TG_HASH.Trim().ToLowerInvariant()
          if ($hash -notmatch '^[0-9a-f]{32}$') {
            throw 'UNIBOX_TELEGRAM_API_HASH must be exactly 32 hexadecimal characters.'
          }
          @{ api_id=$parsed; api_hash=$hash } | ConvertTo-Json -Compress |
            Set-Content '${{ env.NATIVE_SLOT }}/telegram-app.json' -Encoding utf8

      - name: Verify complete immutable runtime slot
        shell: pwsh
        run: |
          $root = '${{ env.NATIVE_SLOT }}'
          $required = @(
            "$root/tuwunel.exe",
            "$root/connectors/mautrix-whatsapp.exe",
            "$root/connectors/mautrix-telegram.exe",
            "$root/connectors/mautrix-signal.exe",
            "$root/connectors/signal_ffi.dll",
            "$root/connectors/mautrix-discord.exe",
            "$root/connectors/mautrix-instagram.exe",
            "$root/connectors/mautrix-meta.exe",
            "$root/connectors/mautrix-gmessages.exe",
            "$root/connectors/mautrix-googlechat.exe",
            "$root/connectors/mautrix-slack.exe",
            "$root/connectors/mautrix-twitter.exe",
            "$root/connectors/mautrix-bluesky.exe",
            "$root/connectors/mautrix-linkedin.exe",
            "$root/connectors/mautrix-gvoice.exe",
            "$root/connectors/mautrix-zulip.exe",
            "$root/connectors/mautrix-irc.exe",
            "$root/telegram-app.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing final runtime file: $file" }
          }
          $count = (Get-ChildItem "$root/connectors/mautrix-*.exe").Count
          if ($count -ne 15) { throw "Expected 15 connector executables, found $count." }

      - name: Validate source again at packaging HEAD
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native end-to-end connector smoke
        shell: pwsh
        env:
          UNIBOX_NATIVE_SMOKE_ROOT: ${{ github.workspace }}/apps/desktop/src-tauri/resources/native-v050
        run: |
          $env:PATH = "$env:UNIBOX_NATIVE_SMOKE_ROOT\connectors;$env:PATH"
          cargo test --locked -p unibox-desktop bundled_runtime_starts_every_advertised_connector -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build final NSIS candidate
        shell: pwsh
        run: |
          pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          Copy-Item $installer.FullName dist/Unibox-Native-Setup.exe -Force
          $hash = (Get-FileHash dist/Unibox-Native-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Unibox-Native-Setup.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unibox-v050-native-all-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  fresh-install:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unibox-v050-native-all-candidate
          path: candidate
      - name: Fresh NSIS install and launch smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'candidate/Unibox-Native-Setup.exe').Path
          $install = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Fresh installer exited with $($install.ExitCode)." }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'Unibox' } | Select-Object -First 1
          if (-not $entry) { throw 'Unibox uninstall registration was not created.' }
          $installDir = $entry.InstallLocation
          if ([string]::IsNullOrWhiteSpace($installDir)) {
            $installDir = Split-Path $entry.UninstallString.Trim('"') -Parent
          }
          $app = Join-Path $installDir 'unibox-desktop.exe'
          if (-not (Test-Path $app)) { throw "Installed desktop executable was not found at $app" }
          if (-not (Test-Path (Join-Path $installDir 'resources\native-v050\tuwunel.exe'))) {
            throw 'Installed native-v050 Tuwunel resource is missing.'
          }
          $proc = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) { throw "Installed Unibox exited during launch smoke with code $($proc.ExitCode)." }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

  upgrade-install:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unibox-v050-native-all-candidate
          path: candidate
      - name: Download previous native installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force previous | Out-Null
          gh release download v0.4.2-authfix --repo $env:GITHUB_REPOSITORY --pattern 'Unibox-Native-Setup.exe' --dir previous
          if (-not (Test-Path 'previous/Unibox-Native-Setup.exe')) { throw 'Previous native installer could not be downloaded.' }
      - name: Upgrade v0.4.2 while app is open and preserve AppData
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $oldSetup = (Resolve-Path 'previous/Unibox-Native-Setup.exe').Path
          $newSetup = (Resolve-Path 'candidate/Unibox-Native-Setup.exe').Path
          $old = Start-Process -FilePath $oldSetup -ArgumentList '/S' -Wait -PassThru
          if ($old.ExitCode -ne 0) { throw "Previous installer exited with $($old.ExitCode)." }

          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'Unibox' } | Select-Object -First 1
          if (-not $entry) { throw 'Previous Unibox install registration was not found.' }
          $installDir = $entry.InstallLocation
          if ([string]::IsNullOrWhiteSpace($installDir)) {
            $installDir = Split-Path $entry.UninstallString.Trim('"') -Parent
          }
          $oldApp = Join-Path $installDir 'unibox-desktop.exe'
          $oldProc = Start-Process -FilePath $oldApp -PassThru
          Start-Sleep -Seconds 3
          if ($oldProc.HasExited) { throw 'Previous Unibox build exited before upgrade smoke.' }

          $dataRoot = Join-Path $env:LOCALAPPDATA 'app.unibox.desktop\runtime-native'
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $marker = Join-Path $dataRoot 'upgrade-preserve.marker'
          'preserve-me' | Set-Content $marker

          $upgrade = Start-Process -FilePath $newSetup -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Upgrade installer exited with $($upgrade.ExitCode)." }
          if (-not (Test-Path $marker)) { throw 'Upgrade deleted AppData runtime state.' }

          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'Unibox' } | Select-Object -First 1
          $installDir = $entry.InstallLocation
          if ([string]::IsNullOrWhiteSpace($installDir)) {
            $installDir = Split-Path $entry.UninstallString.Trim('"') -Parent
          }
          if (-not (Test-Path (Join-Path $installDir 'resources\native-v050\tuwunel.exe'))) {
            throw 'Upgrade did not install immutable native-v050 resources.'
          }
          $app = Join-Path $installDir 'unibox-desktop.exe'
          $proc = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) { throw 'Upgraded Unibox failed to stay running.' }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

  release:
    needs: [package, fresh-install, upgrade-install]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: unibox-v050-native-all-candidate
          path: dist
      - name: Verify release candidate hash and HEAD
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.sha }}') { throw "Checkout SHA $head does not match workflow SHA ${{ github.sha }}." }
          $line = (Get-Content dist/SHA256SUMS.txt | Select-Object -First 1).Trim()
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash dist/Unibox-Native-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Installer SHA256 mismatch: expected $expected, got $actual." }
      - name: Publish v0.5.0-native-all
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.5.0-native-all'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
          }
          $notes = @"
          Windows-native all-services release.

          Passed release gates:
          - Tuwunel Windows build/start/shared-secret registration
          - pnpm check and cargo test --workspace --locked
          - all 15 connector Windows builds
          - all connector config + appservice registration generation
          - native connector start/port-ready smoke
          - BridgeV2 login-flows smoke
          - WhatsApp QR login-start smoke
          - Telegram phone login-start smoke with app-level credentials
          - Signal libsignal FFI runtime packaging
          - Discord legacy bridge runtime
          - standalone Google Chat PyInstaller runtime
          - clean NSIS install
          - v0.4.2 to v0.5.0 upgrade while Unibox is running, with AppData preserved

          Included services:
          WhatsApp, Telegram, Signal, Discord, Instagram, Facebook Messenger,
          Google Messages, Google Chat, Slack, X/Twitter, Bluesky, LinkedIn,
          Google Voice, Zulip and IRC.

          No WSL, Docker, Ubuntu or separate Python runtime is required.
          "@
          gh release create $tag dist/Unibox-Native-Setup.exe dist/SHA256SUMS.txt --target '${{ github.sha }}' --title 'Unibox v0.5.0 Native All Services' --prerelease --notes $notes --repo $env:GITHUB_REPOSITORY
