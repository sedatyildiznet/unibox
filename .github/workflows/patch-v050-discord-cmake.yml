name: Patch v0.5.0 Discord CMake

on:
  push:
    branches: [native-runtime]
    paths:
      - '.github/workflows/patch-v050-discord-cmake.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-runtime
          fetch-depth: 0
      - name: Patch Discord CMake argument handling
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/native-v050-all-services-release.yml')
          s = p.read_text()
          old = '          cmake -S $olmRoot -B $olmBuild -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5\n'
          new = '          $cmakeArgs = @("-S", $olmRoot, "-B", $olmBuild, "-G", "MinGW Makefiles", "-DCMAKE_BUILD_TYPE=Release", "-DBUILD_SHARED_LIBS=OFF", "-DCMAKE_POLICY_VERSION_MINIMUM=3.5")\n          & cmake $cmakeArgs\n'
          if old not in s:
              raise SystemExit('Expected Discord CMake line not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/native-v050-all-services-release.yml
          git commit -m "fix(ci): pass Discord CMake policy as one argument"
          git push origin HEAD:native-runtime
