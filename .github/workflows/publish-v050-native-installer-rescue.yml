name: Publish v0.5.0 Native Installer Rescue

on:
  push:
    branches:
      - native-runtime
    paths:
      - '.github/workflows/publish-v050-native-installer-rescue.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  NATIVE_SLOT: apps/desktop/src-tauri/resources/native-v050
  SOURCE_RUN_ID: '34585052461'

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Reuse validated Tuwunel artifact
        uses: actions/download-artifact@v4
        with:
          name: runtime-v050-tuwunel
          path: ${{ env.NATIVE_SLOT }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse validated connector artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: connector-v050-*
          path: ${{ env.NATIVE_SLOT }}/connectors
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build standalone Google Chat bridge without libmagic scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/mautrix/googlechat.git vendor/googlechat
          Set-Location vendor/googlechat
          Write-Host "Google Chat upstream commit: $((git rev-parse HEAD).Trim())"

          $reqs = Get-Content requirements.txt | Where-Object { $_ -notmatch '^python-magic' }
          $reqs | Set-Content requirements-windows.txt -Encoding utf8
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip install async_timeout
          python -m pip install pyinstaller

          $mautrixConfigFile = (python -c "import mautrix.util.config.file as f; print(f.__file__)").Trim()
          if (-not (Test-Path $mautrixConfigFile)) { throw 'Could not locate mautrix config writer.' }
          $configRaw = Get-Content $mautrixConfigFile -Raw
          if ($configRaw -notmatch 'os\.rename\(tf\.name, self\.path\)') { throw 'Mautrix config writer layout changed.' }
          $configRaw = $configRaw.Replace('os.rename(tf.name, self.path)', 'os.replace(tf.name, self.path)')
          Set-Content $mautrixConfigFile -Value $configRaw -NoNewline -Encoding utf8

          @'
          from __future__ import annotations
          import mimetypes
          from pathlib import Path

          def _sniff(data: bytes) -> str:
              if data.startswith(b"\x89PNG\r\n\x1a\n"):
                  return "image/png"
              if data.startswith(b"\xff\xd8\xff"):
                  return "image/jpeg"
              if data.startswith((b"GIF87a", b"GIF89a")):
                  return "image/gif"
              if len(data) >= 12 and data[:4] == b"RIFF" and data[8:12] == b"WEBP":
                  return "image/webp"
              if data.startswith(b"%PDF-"):
                  return "application/pdf"
              if data.startswith(b"OggS"):
                  return "application/ogg"
              if len(data) >= 12 and data[4:8] == b"ftyp":
                  return "video/mp4"
              return "application/octet-stream"

          def from_buffer(data, mime=False):
              value = _sniff(bytes(data))
              return value if mime else value

          def from_file(filename, mime=False):
              path = Path(filename)
              guessed, _ = mimetypes.guess_type(str(path))
              if guessed:
                  return guessed
              try:
                  value = _sniff(path.read_bytes()[:4096])
              except OSError:
                  value = "application/octet-stream"
              return value if mime else value
          '@ | Set-Content magic.py -Encoding utf8

          @'
          class _Pw:
              pw_name = "windows"
          def getpwuid(uid):
              return _Pw()
          '@ | Set-Content pwd.py -Encoding utf8

          Set-Content unibox_googlechat_launcher.py -Value 'import os; os.environ.setdefault("HOME", os.environ.get("USERPROFILE", ".")); import mautrix_googlechat.__main__' -Encoding utf8

          $args = @(
            '--noconfirm',
            '--clean',
            '--onefile',
            '--name', 'mautrix-googlechat',
            '--paths', '.',
            '--collect-data', 'mautrix',
            '--add-data', 'mautrix_googlechat/example-config.yaml;mautrix_googlechat',
            '--hidden-import', 'mautrix_googlechat.__main__',
            '--hidden-import', 'magic',
            '--hidden-import', 'pwd',
            '--hidden-import', 'mautrix_googlechat.util',
            '--hidden-import', 'mautrix_googlechat.util.color_log',
            '--exclude-module', 'tkinter',
            'unibox_googlechat_launcher.py'
          )
          if (Test-Path 'mautrix_googlechat/web/static') {
            $args = @(
              '--noconfirm',
              '--clean',
              '--onefile',
              '--name', 'mautrix-googlechat',
              '--paths', '.',
              '--collect-data', 'mautrix',
              '--add-data', 'mautrix_googlechat/example-config.yaml;mautrix_googlechat',
              '--add-data', 'mautrix_googlechat/web/static;mautrix_googlechat/web/static',
              '--hidden-import', 'mautrix_googlechat.__main__',
              '--hidden-import', 'magic',
              '--hidden-import', 'pwd',
              '--hidden-import', 'mautrix_googlechat.util',
              '--hidden-import', 'mautrix_googlechat.util.color_log',
              '--exclude-module', 'tkinter',
              'unibox_googlechat_launcher.py'
            )
          }
          & pyinstaller @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/mautrix-googlechat.exe)) { throw 'Google Chat EXE was not produced.' }

          Set-Location ../..
          Copy-Item vendor/googlechat/dist/mautrix-googlechat.exe "${{ env.NATIVE_SLOT }}/connectors/mautrix-googlechat.exe" -Force

      - name: Smoke Google Chat config and registration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path '${{ env.NATIVE_SLOT }}/connectors/mautrix-googlechat.exe').Path
          $root = Join-Path $env:RUNNER_TEMP 'unibox-googlechat-rescue-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $cfg = Join-Path $root 'config.yaml'
          $reg = Join-Path $root 'registration.yaml'
          Copy-Item 'vendor/googlechat/mautrix_googlechat/example-config.yaml' $cfg -Force
          if (-not (Test-Path $cfg)) { throw 'Google Chat example config copy failed.' }
          & ./scripts/ci/patch-generated-matrix-config.ps1 -Path $cfg
          & $exe -g -c $cfg -r $reg
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $reg)) { throw 'Google Chat registration generation failed.' }

      - name: Bundle Telegram application credentials when available
        shell: pwsh
        env:
          TG_ID: ${{ secrets.UNIBOX_TELEGRAM_API_ID }}
          TG_HASH: ${{ secrets.UNIBOX_TELEGRAM_API_HASH }}
        run: |
          $target = '${{ env.NATIVE_SLOT }}/telegram-app.json'
          if ([string]::IsNullOrWhiteSpace($env:TG_ID) -or [string]::IsNullOrWhiteSpace($env:TG_HASH)) {
            Remove-Item $target -Force -ErrorAction SilentlyContinue
            Write-Warning 'Telegram app credentials are not configured. Telegram binary is bundled, but Telegram will remain hidden by the desktop runtime.'
            exit 0
          }
          $parsed = 0L
          if (-not [long]::TryParse($env:TG_ID,[ref]$parsed) -or $parsed -le 0) {
            throw 'UNIBOX_TELEGRAM_API_ID must be a positive integer.'
          }
          $hash = $env:TG_HASH.Trim().ToLowerInvariant()
          if ($hash -notmatch '^[0-9a-f]{32}$') {
            throw 'UNIBOX_TELEGRAM_API_HASH must be exactly 32 hexadecimal characters.'
          }
          @{ api_id=$parsed; api_hash=$hash } | ConvertTo-Json -Compress |
            Set-Content $target -Encoding utf8

      - name: Verify complete native runtime
        shell: pwsh
        run: |
          $root = '${{ env.NATIVE_SLOT }}'
          $required = @(
            "$root/tuwunel.exe",
            "$root/connectors/mautrix-whatsapp.exe",
            "$root/connectors/mautrix-telegram.exe",
            "$root/connectors/mautrix-signal.exe",
            "$root/connectors/signal_ffi.dll",
            "$root/connectors/mautrix-discord.exe",
            "$root/connectors/mautrix-instagram.exe",
            "$root/connectors/mautrix-meta.exe",
            "$root/connectors/mautrix-gmessages.exe",
            "$root/connectors/mautrix-googlechat.exe",
            "$root/connectors/mautrix-slack.exe",
            "$root/connectors/mautrix-twitter.exe",
            "$root/connectors/mautrix-bluesky.exe",
            "$root/connectors/mautrix-linkedin.exe",
            "$root/connectors/mautrix-gvoice.exe",
            "$root/connectors/mautrix-zulip.exe",
            "$root/connectors/mautrix-irc.exe"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing runtime file: $file" }
          }
          $count = (Get-ChildItem "$root/connectors/mautrix-*.exe").Count
          if ($count -ne 15) { throw "Expected 15 connector EXEs, found $count." }

      - name: Validate source
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS installer
        shell: pwsh
        run: |
          pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          Copy-Item $installer.FullName dist/Unibox-Native-Setup.exe -Force
          $hash = (Get-FileHash dist/Unibox-Native-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Unibox-Native-Setup.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA256=$hash"

      - name: Fresh install smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'dist/Unibox-Native-Setup.exe').Path
          $install = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Fresh installer exited with $($install.ExitCode)." }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'Unibox' } | Select-Object -First 1
          if (-not $entry) { throw 'Unibox uninstall registration was not created.' }
          $installDir = $entry.InstallLocation
          if ([string]::IsNullOrWhiteSpace($installDir)) {
            $installDir = Split-Path $entry.UninstallString.Trim('"') -Parent
          }
          $app = Join-Path $installDir 'unibox-desktop.exe'
          if (-not (Test-Path $app)) { throw "Installed desktop EXE missing: $app" }
          if (-not (Test-Path (Join-Path $installDir 'resources\native-v050\tuwunel.exe'))) {
            throw 'Installed Tuwunel resource is missing.'
          }
          $proc = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) { throw "Installed Unibox exited with $($proc.ExitCode)." }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: unibox-v050-native-all-rescue
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish installer to v0.5.0-native-all
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.5.0-native-all'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target '${{ github.sha }}' --title 'Unibox v0.5.0 Native All Services' --prerelease --notes 'Windows-native all-services release.' --repo $env:GITHUB_REPOSITORY
          }
          gh release upload $tag dist/Unibox-Native-Setup.exe dist/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
