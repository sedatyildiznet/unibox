name: Unibox v0.3.4 Expanded Native Connectors

on:
  push:
    branches:
      - release/v0.3.4-native-connectors
    paths:
      - '.github/workflows/release-v034.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: unibox-v034-release
  cancel-in-progress: true

jobs:
  build-extended:
    runs-on: windows-latest
    timeout-minutes: 50
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: instagram, repo: mautrix/meta, package: ./cmd/mautrix-instagram, output: mautrix-instagram.exe }
          - { id: messenger, repo: mautrix/meta, package: ./cmd/mautrix-meta, output: mautrix-meta.exe }
          - { id: gmessages, repo: mautrix/gmessages, package: ./cmd/mautrix-gmessages, output: mautrix-gmessages.exe }
          - { id: slack, repo: mautrix/slack, package: ./cmd/mautrix-slack, output: mautrix-slack.exe }
          - { id: twitter, repo: mautrix/twitter, package: ./cmd/mautrix-twitter, output: mautrix-twitter.exe }
          - { id: bluesky, repo: mautrix/bluesky, package: ./cmd/mautrix-bluesky, output: mautrix-bluesky.exe }
          - { id: linkedin, repo: mautrix/linkedin, package: ./cmd/mautrix-linkedin, output: mautrix-linkedin.exe }
          - { id: gvoice, repo: mautrix/gvoice, package: ./cmd/mautrix-gvoice, output: mautrix-gvoice.exe }
          - { id: zulip, repo: mautrix/zulip, package: ./cmd/mautrix-zulip, output: mautrix-zulip.exe }
          - { id: irc, repo: mautrix/irc, package: ./cmd/mautrix-irc, output: mautrix-irc.exe }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Checkout connector
        shell: pwsh
        run: git clone --depth 1 https://github.com/${{ matrix.repo }}.git vendor/bridge

      - name: Patch mautrix Windows config replacement
        working-directory: vendor/bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $utilDir = (go list -m -f '{{.Dir}}' go.mau.fi/util).Trim()
          if ($utilDir -and (Test-Path $utilDir)) {
            $upgrade = Join-Path $utilDir 'configupgrade\upgrade.go'
            if (Test-Path $upgrade) {
              attrib -R $upgrade 2>$null
              $raw = Get-Content $upgrade -Raw
              if ($raw -notmatch 'tempFile\.Close\(\)') {
                $needle = "`terr = os.Rename(tempFile.Name(), configPath)"
                if ($raw.Contains($needle)) {
                  $replacement = @"
          `terr = tempFile.Close()
          `tif err != nil {
          `t`t_ = os.Remove(tempFile.Name())
          `t`treturn output, true, fmt.Errorf("failed to close temp file before replacing config: %w", err)
          `t}
          `terr = os.Rename(tempFile.Name(), configPath)
          "@.Trim()
                  $raw = $raw.Replace($needle, $replacement)
                  Set-Content -Path $upgrade -Value $raw -NoNewline -Encoding utf8
                  gofmt -w $upgrade
                }
              }
            }
          }

      - name: Build Windows connector
        working-directory: vendor/bridge
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          New-Item -ItemType Directory -Force -Path ../../out | Out-Null
          go build -tags goolm -trimpath -ldflags="-s -w" -o ../../out/${{ matrix.output }} ${{ matrix.package }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item ../../out/${{ matrix.output }}).Length -lt 1MB) { throw 'Connector binary is unexpectedly small.' }

      - name: Native registration smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'connector-smoke'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $config = Join-Path $root 'config.yaml'
          $registration = Join-Path $root 'registration.yaml'
          $exe = (Resolve-Path 'out/${{ matrix.output }}').Path
          & $exe -e -c $config
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $config)) { throw 'Example config generation failed.' }
          $cfg = Get-Content $config -Raw
          $cfg = [regex]::Replace($cfg, '(?m)^(\s*domain:)\s*.*$', '$1 unibox.local')
          $cfg = $cfg.Replace('http://example.localhost:8008', 'http://127.0.0.1:18008')
          $cfg = $cfg.Replace('http://localhost:8008', 'http://127.0.0.1:18008')
          Set-Content -Path $config -Value $cfg -NoNewline -Encoding utf8
          & $exe -g -c $config -r $registration
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $registration)) { throw 'Appservice registration generation failed.' }

      - uses: actions/upload-artifact@v4
        with:
          name: native-ext-${{ matrix.id }}
          path: out/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7

  package:
    needs: build-extended
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified Tuwunel
        uses: actions/download-artifact@v4
        with:
          name: tuwunel-windows-native
          path: apps/desktop/src-tauri/resources/native-v034
          repository: sedatyildiznet/unibox
          run-id: 34465477705
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download patched WhatsApp
        uses: actions/download-artifact@v4
        with:
          name: native-bridge-whatsapp
          path: apps/desktop/src-tauri/resources/native-v034/connectors
          repository: sedatyildiznet/unibox
          run-id: 34506961399
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download patched Telegram
        uses: actions/download-artifact@v4
        with:
          name: native-bridge-telegram
          path: apps/desktop/src-tauri/resources/native-v034/connectors
          repository: sedatyildiznet/unibox
          run-id: 34506961399
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download successful expanded connectors
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: native-ext-*
          path: apps/desktop/src-tauri/resources/native-v034/connectors
          merge-multiple: true

      - name: Verify core native resources
        shell: pwsh
        run: |
          $required = @(
            'apps/desktop/src-tauri/resources/native-v034/tuwunel.exe',
            'apps/desktop/src-tauri/resources/native-v034/connectors/mautrix-whatsapp.exe',
            'apps/desktop/src-tauri/resources/native-v034/connectors/mautrix-telegram.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required native resource: $path" }
            if ((Get-Item $path).Length -lt 1MB) { throw "Native resource is unexpectedly small: $path" }
          }
          Write-Host 'Packaged native connectors:'
          Get-ChildItem 'apps/desktop/src-tauri/resources/native-v034/connectors/*.exe' | Select-Object -ExpandProperty Name

      - name: Validate application
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS setup
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          Copy-Item $installer.FullName 'dist/Unibox-Native-Setup.exe' -Force
          Copy-Item 'target/release/unibox-desktop.exe' 'dist/Unibox-Native-Portable.exe' -Force
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: unibox-v034-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.3.4-native-connectors'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
          }
          $connectors = (Get-ChildItem 'apps/desktop/src-tauri/resources/native-v034/connectors/*.exe' | Select-Object -ExpandProperty BaseName) -join ', '
          $notes = @"
          WSL-free native Windows build.

          Fixed:
          - WhatsApp BridgeV2 provisioning now sends both the local Matrix access token and required user_id, fixing M_UNKNOWN_TOKEN / Invalid auth token
          - Telegram now asks for API ID and API hash before startup and stores them locally instead of crashing with api_hash is required
          - service picker is no longer limited to the first two cards
          - bundled service logos are used in the picker
          - runtime executables use the immutable native-v034 slot to avoid Windows upgrade file locks

          Packaged native connectors:
          $connectors

          Signal is not bundled in this build because current mautrix/signal requires a libsignal FFI Windows port/link step that has not passed the native gate. Discord and Google Chat are legacy adapters rather than the BridgeV2 native path and are not falsely advertised as working here.
          "@
          gh release create $tag dist/* --target $env:GITHUB_SHA --title 'Unibox v0.3.4 Expanded Native Connectors' --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
