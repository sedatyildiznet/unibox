name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify connector registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify-registry.py

      - name: Verify managed runtime contract
        run: python scripts/verify-runtime-contract.py

      - name: Verify Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Verify frontend and lifecycle behavior
        run: |
          pnpm test
          pnpm check
          ./scripts/test-bootstrap.ps1

      - name: Verify updater signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $config = Get-Content 'apps/desktop/src-tauri/tauri.conf.json' -Raw
          if ($config -match 'REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY') {
            Write-Error 'Updater public key is not configured. Generate the Tauri signing key, store the private key/password as GitHub Actions secrets, and commit only the public key to tauri.conf.json.'
            exit 1
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error 'TAURI_SIGNING_PRIVATE_KEY secret is missing.'
            exit 1
          }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Unibox v__VERSION__'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: true
          prerelease: false
